<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 792" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="614" height="792" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Cascode refresher (everything Lec 5–8 builds on)</text><rect x="6" y="30" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><polyline points="60,20 200,20" fill="none" stroke="#222" stroke-width="2.2"/><text x="204" y="24" font-size="11" fill="#6a7079" text-anchor="start">VDD</text><circle cx="110" cy="50" r="12" fill="#fff" stroke="#222" stroke-width="1.6"/><line x1="110" y1="44" x2="110" y2="57" stroke="#222" stroke-width="1.5" marker-end="url(#ah222)"/><text x="126" y="54" font-size="12" fill="#222" text-anchor="start">load I<tspan baseline-shift="sub" font-size="75%">1</tspan></text><polyline points="110,38 110,20" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,62 110,90" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="110" cy="80" r="3" fill="#222"/><text x="118" y="84" font-size="12" fill="#c9561c" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><polyline points="98,102 98,138" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="92,105 92,135" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="98,108 110,108 110,90" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="98,132 110,132 110,150" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="92,120 80,120" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="109,132 101,128 101,136" fill="#6b4fbb"/><text x="77" y="124" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b</tspan></text><text x="118" y="124" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M2</text><circle cx="110" cy="150" r="3" fill="#222"/><text x="118" y="154" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">X</text><polyline points="98,162 98,198" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="92,165 92,195" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="98,168 110,168 110,150" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="98,192 110,192 110,210" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="92,180 80,180" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="109,192 101,188 101,196" fill="#6b4fbb"/><text x="77" y="184" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text><text x="118" y="184" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M1</text><polyline points="110,210 110,218" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="100,218 120,218" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="104,222 116,222" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="108,226 112,226" fill="none" stroke="#222" stroke-width="1.6"/><text x="150" y="116" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">SHIELD</text><text x="150" y="130" font-size="11" fill="#0e7d76" text-anchor="start">gate fixed → X still</text><text x="150" y="176" font-size="12" fill="#6b4fbb" text-anchor="start" font-weight="600">PUMP</text><text x="150" y="190" font-size="11" fill="#6b4fbb" text-anchor="start">v<tspan baseline-shift="sub" font-size="75%">in</tspan> → g<tspan baseline-shift="sub" font-size="75%">m1</tspan> v<tspan baseline-shift="sub" font-size="75%">in</tspan></text><text x="140.0" y="252" font-size="11.5" fill="#6a7079" text-anchor="middle">M1 makes the current,</text><text x="140.0" y="268" font-size="11.5" fill="#6a7079" text-anchor="middle">M2 carries it up and guards M1</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="311.0" y="192.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="354" font-size="12.5" fill="#222" text-anchor="middle">Two jobs in one column: pump and shield</text><rect x="320" y="30" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,34)"><text x="140.0" y="34" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The four look-in resistances</text><text x="14" y="62" font-size="12.2" fill="#6a7079" text-anchor="start">into a drain, source grounded:</text><text x="133.11" y="90" font-size="13" fill="#222" font-weight="600" xml:space="preserve">r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><text x="14" y="118" font-size="12.2" fill="#6a7079" text-anchor="start">into a drain with R<tspan baseline-shift="sub" font-size="75%">S</tspan> under it (UP ×):</text><text x="109.58" y="146" font-size="13" fill="#6b4fbb" font-weight="600" xml:space="preserve">≈ g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan> R<tspan baseline-shift="sub" font-size="75%">S</tspan></text><text x="14" y="174" font-size="12.2" fill="#6a7079" text-anchor="start">into a source, R<tspan baseline-shift="sub" font-size="75%">D</tspan> on the drain (DOWN ÷):</text><text x="120.2746" y="190.84" font-size="11.18" fill="#0e7d76" text-anchor="middle" font-weight="600">R<tspan baseline-shift="sub" font-size="75%">D</tspan> + r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><line x1="94.3618" y1="197.84" x2="146.1874" y2="197.84" stroke="#0e7d76" stroke-width="1.3"/><text x="120.2746" y="211.02" font-size="11.18" fill="#0e7d76" text-anchor="middle" font-weight="600">1 + g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><text x="148.1874" y="202" font-size="13" fill="#0e7d76" font-weight="600" xml:space="preserve"> ≈ </text><text x="175.7128" y="193.84" font-size="11.18" fill="#0e7d76" text-anchor="middle" font-weight="600">1</text><line x1="165.7874" y1="197.84" x2="185.63819999999998" y2="197.84" stroke="#0e7d76" stroke-width="1.3"/><text x="175.7128" y="211.02" font-size="11.18" fill="#0e7d76" text-anchor="middle" font-weight="600">g<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="14" y="230" font-size="12.2" fill="#6a7079" text-anchor="start">into a gate:</text><text x="93.20000000000002" y="258" font-size="13" fill="#222" font-weight="600" xml:space="preserve">∞ (no current)</text></g><circle cx="334" cy="44" r="10" fill="#c9561c"/><text x="334" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="464.0" y="354" font-size="12.5" fill="#222" text-anchor="middle">“Up multiplies, down divides”</text><rect x="6" y="392" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,396)"><text x="140.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">So the cascode gives</text><text x="115.43" y="72" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">G<tspan baseline-shift="sub" font-size="75%">m</tspan> ≈ g<tspan baseline-shift="sub" font-size="75%">m1</tspan></text><text x="140.0" y="104" font-size="12" fill="#6a7079" text-anchor="middle">M1’s current goes up into 1/g<tspan baseline-shift="sub" font-size="75%">m2</tspan></text><text x="82.80000000000001" y="136" font-size="13" fill="#6b4fbb" font-weight="600" xml:space="preserve">R<tspan baseline-shift="sub" font-size="75%">down</tspan> = g<tspan baseline-shift="sub" font-size="75%">m2</tspan> r<tspan baseline-shift="sub" font-size="75%">O2</tspan> r<tspan baseline-shift="sub" font-size="75%">O1</tspan></text><text x="140.0" y="168" font-size="12" fill="#6a7079" text-anchor="middle">M2 multiplies r<tspan baseline-shift="sub" font-size="75%">O1</tspan> by g<tspan baseline-shift="sub" font-size="75%">m2</tspan> r<tspan baseline-shift="sub" font-size="75%">O2</tspan></text><text x="73.44" y="200" font-size="13" fill="#2e7d4f" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">v</tspan> = G<tspan baseline-shift="sub" font-size="75%">m</tspan> R<tspan baseline-shift="sub" font-size="75%">out</tspan> ≈ (g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="140.0" y="232" font-size="12" fill="#6a7079" text-anchor="middle">with an ideal load; ÷2 with a cascode load</text></g><circle cx="20" cy="406" r="10" fill="#c9561c"/><text x="20" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="311.0" y="554.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="716" font-size="12.5" fill="#222" text-anchor="middle">Every cascode result in one place</text><rect x="320" y="392" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,396)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The price: one more V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><rect x="70" y="220.0" width="50" height="30.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="95.0" y="239.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M1</text><rect x="70" y="190.0" width="50" height="30.0" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="95.0" y="209.0" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M2</text><text x="65" y="254" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="65" y="224.0" font-size="11.5" fill="#222" text-anchor="end">X 0.2</text><text x="65" y="194.0" font-size="11.5" fill="#222" text-anchor="end">0.4</text><rect x="190" y="220.0" width="50" height="30.0" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="215.0" y="239.0" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M1</text><text x="185" y="224.0" font-size="11.5" fill="#222" text-anchor="end">0.2</text><text x="95" y="272" font-size="11.5" fill="#6b4fbb" text-anchor="middle" font-weight="600">cascode: V<tspan baseline-shift="sub" font-size="75%">out</tspan> ≥ 0.4</text><text x="215" y="272" font-size="11.5" fill="#6a7079" text-anchor="middle" font-weight="600">plain CS: V<tspan baseline-shift="sub" font-size="75%">out</tspan> ≥ 0.2</text><text x="140.0" y="292" font-size="11.5" fill="#2e7d4f" text-anchor="middle" font-weight="600">gain × g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>; swing − V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text></g><circle cx="334" cy="406" r="10" fill="#c9561c"/><text x="334" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="464.0" y="716" font-size="12.5" fill="#222" text-anchor="middle">Stacking costs headroom</text><rect x="10" y="760" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="778" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Gain = G<tspan baseline-shift="sub" font-size="75%">m</tspan> × R<tspan baseline-shift="sub" font-size="75%">out</tspan>: the cascode keeps G<tspan baseline-shift="sub" font-size="75%">m</tspan> and multiplies R<tspan baseline-shift="sub" font-size="75%">out</tspan></text></svg>