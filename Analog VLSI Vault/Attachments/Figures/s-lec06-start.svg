300" y="30" width="268" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,34)"><text x="138.0" y="26" font-size="13" fill="#0e7d76" text-anchor="middle" font-weight="600">PMOS fence (mirror image)</text><polyline points="58,112 58,148" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="52,115 52,145" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="58,118 70,118 70,100" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="58,142 70,142 70,160" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="52,130 38,130" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="59,118 67,114 67,122" fill="#0e7d76"/><text x="35" y="134" font-size="12" fill="#0e7d76" text-anchor="end">G</text><text x="78" y="108" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">S</text><text x="78" y="160" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">D</text><rect x="150" y="56" width="14" height="44" rx="2" fill="#f9e3df" stroke="#b8382a"/><rect x="150" y="100" width="14" height="110" rx="2" fill="#e2f1e7" stroke="#2e7d4f"/><polyline points="144,100 170,100" fill="none" stroke="#c9561c" stroke-width="2"/><text x="174" y="104" font-size="12" fill="#c9561c" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">G</tspan> + |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text><polyline points="144,156 170,156" fill="none" stroke="#222" stroke-width="1.6"/><text x="174" y="160" font-size="12" fill="#222" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">G</tspan></text><text x="174" y="76" font-size="11.5" fill="#b8382a" text-anchor="start" font-weight="600">triode</text><text x="174" y="196" font-size="11.5" fill="#2e7d4f" text-anchor="start" font-weight="600">drain OK</text><text x="83.52000000000001" y="236" font-size="14" fill="#0e7d76" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">D</tspan> ≤ V<tspan baseline-shift="sub" font-size="75%">G</tspan> + |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text></g><circle cx="314" cy="44" r="10" fill="#c9561c"/><text x="314" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="434.0" y="304" font-size="12.5" fill="#222" text-anchor="middle">A gate can sit up to |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| below a PMOS</text><text x="434.0" y="319" font-size="12.5" fill="#222" text-anchor="middle">drain</text><rect x="6" y="342" width="268" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,346)"><text x="138.0" y="24" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Check vs link (one PMOS)</text><polyline points="60,50 140,50" fill="none" stroke="#222" stroke-width="2.2"/><text x="144" y="54" font-size="11" fill="#6a7079" text-anchor="start">source</text><polyline points="88,92 88,128" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="82,95 82,125" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="88,98 100,98 100,80" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="88,122 100,122 100,140" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="82,110 68,110" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="89,98 97,94 97,102" fill="#0e7d76"/><text x="108" y="114" font-size="13" fill="#0e7d76" text-anchor="start" font-weight="600">M</text><text x="108" y="152" font-size="11.5" fill="#6a7079" text-anchor="start">drain</text><polyline points="150,54 150,136" fill="none" stroke="#b8382a" stroke-width="1.8"/><polyline points="145,54 155,54" fill="none" stroke="#b8382a" stroke-width="1.6"/><polyline points="145,136 155,136" fill="none" stroke="#b8382a" stroke-width="1.6"/><text x="160" y="88" font-size="12" fill="#b8382a" text-anchor="start" font-weight="600">CHECK</text><text x="160" y="104" font-size="11" fill="#b8382a" text-anchor="start">source→drain</text><text x="160" y="120" font-size="11" fill="#b8382a" text-anchor="start">≥ |V<tspan baseline-shift="sub" font-size="75%">ov</tspan>| (0.2)</text><polyline points="100,56 54,56 54,104" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="54,110 50,102 58,102" fill="#2b6cb0"/><text x="10" y="140" font-size="12" fill="#2b6cb0" text-anchor="start" font-weight="600">LINK</text><text x="10" y="156" font-size="11" fill="#2b6cb0" text-anchor="start">source→gate</text><text x="10" y="172" font-size="11" fill="#2b6cb0" text-anchor="start">= |V<tspan baseline-shift="sub" font-size="75%">GS</tspan>| (0.7)</text><text x="130.0" y="206" font-size="11.5" fill="#b8382a" text-anchor="middle" font-weight="600">a check can fail (triode)</text><text x="130.0" y="224" font-size="11.5" fill="#2b6cb0" text-anchor="middle" font-weight="600">a link is fixed: it moves the gate</text><text x="130.0" y="242" font-size="11.5" fill="#2b6cb0" text-anchor="middle">with its source, always 0.7 apart</text></g><circle cx="20" cy="356" r="10" fill="#c9561c"/><text x="20" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140.0" y="616" font-size="12.5" fill="#222" text-anchor="middle">Checks give where a node may go; the link</text><text x="140.0" y="631" font-size="12.5" fill="#222" text-anchor="middle">reaches the gate</text><rect x="300" y="342" width="268" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,346)"><text x="130.0" y="30" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Gain by “two looks”</text><text x="66.685" y="61" font-size="13.5" fill="#c9561c" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">v</tspan> = G<tspan baseline-shift="sub" font-size="75%">m</tspan> (R<tspan baseline-shift="sub" font-size="75%">up</tspan> || R<tspan baseline-shift="sub" font-size="75%">down</tspan>)</text><text x="130.0" y="92" font-size="12" fill="#6a7079" text-anchor="middle">G<tspan baseline-shift="sub" font-size="75%">m</tspan> ≈ g<tspan baseline-shift="sub" font-size="75%">m</tspan> of the input device</text><text x="130.0" y="123" font-size="13" fill="#222" text-anchor="middle" font-weight="600">a cascode multiplies what is under it</text><text x="54.94000000000001" y="154" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">R = g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan> × (R under it)</text><text x="130.0" y="185" font-size="12" fill="#6a7079" text-anchor="middle">into a source you see only ≈ 1/g<tspan baseline-shift="sub" font-size="75%">m</tspan> (small),</text><text x="130.0" y="216" font-size="12" fill="#6a7079" text-anchor="middle">so signal current goes into the source</text></g><circle cx="314" cy="356" r="10" fill="#c9561c"/><text x="314" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="434.0" y="616" font-size="12.5" fill="#222" text-anchor="middle">Every gain in Lec 1–8 is read off this way</text><rect x="10" y="660" width="554" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="287.0" y="678" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Every CM limit and swing = a walk from one rail, using these fences</text></svg>