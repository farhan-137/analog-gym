er) is the worst case</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="130.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">The recipe</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">PM = 180° + phase of βA where |βA| = 1</text></svg>