<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="600" height="400" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">What gain boosting changes, and what it does not</text><rect x="6" y="30" width="588" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><rect x="4" y="10" width="572" height="28" rx="4" fill="#f3efe6" stroke="#c9c2b2"/><text x="12" y="30" font-size="12.5" fill="#222" text-anchor="start" font-weight="600"></text><text x="170" y="30" font-size="12.5" fill="#6a7079" text-anchor="start" font-weight="600">plain cascode</text><text x="330" y="30" font-size="12.5" fill="#6a7079" text-anchor="start" font-weight="600">gain-boosted cascode</text><text x="12" y="60" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">G<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="170" y="60" font-size="12.5" fill="#222" text-anchor="start">≈ g<tspan baseline-shift="sub" font-size="75%">m1</tspan></text><text x="330" y="60" font-size="12.5" fill="#2e7d4f" text-anchor="start">≈ g<tspan baseline-shift="sub" font-size="75%">m1</tspan>  (same)</text><rect x="4" y="70" width="572" height="28" rx="0" fill="#fbfaf7" stroke="#fbfaf7"/><text x="12" y="90" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">R<tspan baseline-shift="sub" font-size="75%">out</tspan></text><text x="170" y="90" font-size="12.5" fill="#222" text-anchor="start">g<tspan baseline-shift="sub" font-size="75%">m2</tspan> r<tspan baseline-shift="sub" font-size="75%">O2</tspan> r<tspan baseline-shift="sub" font-size="75%">O1</tspan></text><text x="330" y="90" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">(1 + A<tspan baseline-shift="sub" font-size="75%">1</tspan>) g<tspan baseline-shift="sub" font-size="75%">m2</tspan> r<tspan baseline-shift="sub" font-size="75%">O2</tspan> r<tspan baseline-shift="sub" font-size="75%">O1</tspan></text><text x="12" y="120" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">gain</text><text x="170" y="120" font-size="12.5" fill="#222" text-anchor="start">(g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="330" y="120" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">(g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">3</tspan> when A<tspan baseline-shift="sub" font-size="75%">1</tspan> = g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><rect x="4" y="130" width="572" height="28" rx="0" fill="#fbfaf7" stroke="#fbfaf7"/><text x="12" y="150" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">output column</text><text x="170" y="150" font-size="12.5" fill="#222" text-anchor="start">M2 on M1</text><text x="330" y="150" font-size="12.5" fill="#2e7d4f" text-anchor="start">M2 on M1, nothing stacked  (same)</text><text x="12" y="180" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">lowest V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><text x="170" y="180" font-size="12.5" fill="#222" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">ov1</tspan> + V<tspan baseline-shift="sub" font-size="75%">ov2</tspan></text><text x="330" y="180" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">CS booster: V<tspan baseline-shift="sub" font-size="75%">GS3</tspan> + V<tspan baseline-shift="sub" font-size="75%">ov2</tspan>; folded: no loss</text><rect x="4" y="190" width="572" height="28" rx="0" fill="#fbfaf7" stroke="#fbfaf7"/><text x="12" y="210" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">extra cost</text><text x="170" y="210" font-size="12.5" fill="#222" text-anchor="start">—</text><text x="330" y="210" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">booster current and one more node</text><text x="12" y="240" font-size="12.5" fill="#222" text-anchor="start" font-weight="600">booster wiring</text><text x="170" y="240" font-size="12.5" fill="#222" text-anchor="start">—</text><text x="330" y="240" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">senses M2’s source X, drives M2’s gate</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="300.0" y="324" font-size="12.5" fill="#222" text-anchor="middle">Green = unchanged, red = what boosting changes</text><rect x="10" y="368" width="580" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="300.0" y="386" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Same G<tspan baseline-shift="sub" font-size="75%">m</tspan> and R<tspan baseline-shift="sub" font-size="75%">out</tspan> × (1 + A<tspan baseline-shift="sub" font-size="75%">1</tspan>), with no extra device in the output column</text></svg>