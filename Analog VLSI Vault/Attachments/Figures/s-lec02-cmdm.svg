1c" font-weight="600" xml:space="preserve">v<tspan baseline-shift="sub" font-size="75%">d</tspan> = V<tspan baseline-shift="sub" font-size="75%">in1</tspan> − V<tspan baseline-shift="sub" font-size="75%">in2</tspan></text><text x="120.0" y="166" font-size="13" fill="#6a7079" text-anchor="middle">the signal: their difference</text><text x="66.31880000000001" y="206" font-size="14" fill="#6b4fbb" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">in1</tspan> = V<tspan baseline-shift="sub" font-size="75%">CM</tspan> + </text><text x="161.3" y="194.52" font-size="12.04" fill="#6b4fbb" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><line x1="150.9188" y1="201.52" x2="171.6812" y2="201.52" stroke="#6b4fbb" stroke-width="1.3"/><text x="161.3" y="215.56" font-size="12.04" fill="#6b4fbb" text-anchor="middle">2</text><text x="66.31880000000001" y="246" font-size="14" fill="#0e7d76" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">in2</tspan> = V<tspan baseline-shift="sub" font-size="75%">CM</tspan> − </text><text x="161.3" y="234.52" font-size="12.04" fill="#0e7d76" text-anchor="middle">v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><line x1="150.9188" y1="241.52" x2="171.6812" y2="241.52" stroke="#0e7d76" stroke-width="1.3"/><text x="161.3" y="255.56" font-size="12.04" fill="#0e7d76" text-anchor="middle">2</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">The definitions</text><rect x="6" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="120.0" y="26" font-size="13" fill="#222" text-anchor="middle" font-weight="600">what each one does to the pair</text><rect x="14" y="44" width="100" height="170" rx="6" fill="#fbfaf7" stroke="#d8d2c4"/><rect x="126" y="44" width="100" height="170" rx="6" fill="#fbfaf7" stroke="#d8d2c4"/><text x="64" y="64" font-size="12" fill="#222" text-anchor="middle" font-weight="600">move V<tspan baseline-shift="sub" font-size="75%">CM</tspan></text><line x1="44" y1="122" x2="44" y2="92" stroke="#6b4fbb" stroke-width="2" marker-end="url(#ah6b4fbb)"/><line x1="84" y1="122" x2="84" y2="92" stroke="#0e7d76" stroke-width="2" marker-end="url(#ah0e7d76)"/><text x="64" y="142" font-size="11.5" fill="#6a7079" text-anchor="middle">both gates ↑</text><text x="64" y="162" font-size="11" fill="#6a7079" text-anchor="middle">currents stay</text><text x="46.45" y="184.84" font-size="11.18" fill="#2e7d4f" text-anchor="middle" font-weight="600">I<tspan baseline-shift="sub" font-size="75%">SS</tspan></text><line x1="35.6302" y1="191.84" x2="57.269800000000004" y2="191.84" stroke="#2e7d4f" stroke-width="1.3"/><text x="46.45" y="205.02" font-size="11.18" fill="#2e7d4f" text-anchor="middle" font-weight="600">2</text><text x="59.269800000000004" y="196" font-size="13" fill="#2e7d4f" font-weight="600" xml:space="preserve"> each</text><text x="176" y="64" font-size="12" fill="#222" text-anchor="middle" font-weight="600">apply v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><line x1="156" y1="122" x2="156" y2="92" stroke="#6b4fbb" stroke-width="2" marker-end="url(#ah6b4fbb)"/><line x1="196" y1="92" x2="196" y2="122" stroke="#0e7d76" stroke-width="2" marker-end="url(#ah0e7d76)"/><text x="176" y="142" font-size="11.5" fill="#6a7079" text-anchor="middle">one ↑, one ↓</text><text x="176" y="162" font-size="11" fill="#6a7079" text-anchor="middle">current steered</text><text x="150.6222" y="196" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">± </text><text x="181.84999999999997" y="184.84" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">g<tspan baseline-shift="sub" font-size="75%">m</tspan> v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><line x1="164.32219999999998" y1="191.84" x2="199.37779999999998" y2="191.84" stroke="#c9561c" stroke-width="1.3"/><text x="181.84999999999997" y="205.02" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="120.0" y="244" font-size="12" fill="#222" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">CM</tspan>: sets the bias &amp; the CM range</text><text x="120.0" y="264" font-size="12" fill="#c9561c" text-anchor="middle" font-weight="600">v<tspan baseline-shift="sub" font-size="75%">d</tspan>: the signal that is amplified</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="130.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">The tail fixes the sum, so only v<tspan baseline-shift="sub" font-size="75%">d</tspan></text><text x="130.0" y="711" font-size="12.5" fill="#222" text-anchor="middle">steers current</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Common mode = the average of the two inputs; differential = their difference</text></svg>