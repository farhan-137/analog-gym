<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="540" height="400" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Dominant-pole compensation</text><rect x="6" y="30" width="528" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><polyline points="30,230 500,230" fill="none" stroke="#6a7079" stroke-width="1.4"/><polyline points="30,230 30,30" fill="none" stroke="#6a7079" stroke-width="1.4"/><text x="500" y="246" font-size="12" fill="#6a7079" text-anchor="end">f (log)</text><text x="34" y="32" font-size="12" fill="#6a7079" text-anchor="start">|βA| dB</text><polyline points="30,175 500,175" fill="none" stroke="#6a7079" stroke-width="1.6" stroke-dasharray="4 3"/><text x="500" y="170" font-size="11" fill="#6a7079" text-anchor="end">0 dB</text><polyline points="30,50 200,50 300,110 380,190 440,260" fill="none" stroke="#b8382a" stroke-width="2.2"/><text x="204" y="44" font-size="12" fill="#b8382a" text-anchor="start" font-weight="600">before: 3 poles</text><text x="370" y="165" font-size="11" fill="#b8382a" text-anchor="start">crosses 0 dB too late</text><polyline points="30,50 60,50 300,175 340,205" fill="none" stroke="#2e7d4f" stroke-width="2.4"/><circle cx="60" cy="50" r="4" fill="#2e7d4f"/><text x="40" y="112" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="600">f<tspan baseline-shift="sub" font-size="75%">D</tspan>: dominant pole</text><text x="40" y="128" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="600">pushed down</text><circle cx="300" cy="175" r="4" fill="#2e7d4f"/><text x="296" y="196" font-size="11.5" fill="#2e7d4f" text-anchor="end">now 0 dB at the 2nd pole</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="270.0" y="324" font-size="12.5" fill="#222" text-anchor="middle">Compensation: lower the first pole until the loop gain reaches 1 before the phase gets</text><text x="270.0" y="339" font-size="12.5" fill="#222" text-anchor="middle">dangerous</text><rect x="10" y="368" width="520" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="270.0" y="386" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Trade bandwidth for stability: f<tspan baseline-shift="sub" font-size="75%">D</tspan> = f<tspan baseline-shift="sub" font-size="75%">gx</tspan> / (βA<tspan baseline-shift="sub" font-size="75%">0</tspan>)</text></svg>