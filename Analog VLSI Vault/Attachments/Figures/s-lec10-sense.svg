<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="534" height="400" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Sensing the output CM</text><rect x="6" y="30" width="248" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><polyline points="14,100 40,100" fill="none" stroke="#222" stroke-width="1.6"/><text x="14" y="90" font-size="12" fill="#6b4fbb" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out1</tspan></text><polyline points="40,100 48,100 52.5,105 61.5,95 70.5,105 79.5,95 88.5,105 97.5,95 102,100 110,100" fill="none" stroke="#222" stroke-width="1.6"/><text x="75.0" y="91" font-size="12" fill="#222" text-anchor="middle">R</text><circle cx="120" cy="100" r="3" fill="#222"/><polyline points="130,100 138,100 142.5,105 151.5,95 160.5,105 169.5,95 178.5,105 187.5,95 192,100 200,100" fill="none" stroke="#222" stroke-width="1.6"/><text x="165.0" y="91" font-size="12" fill="#222" text-anchor="middle">R</text><polyline points="110,100 130,100" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="200,100 226,100" fill="none" stroke="#222" stroke-width="1.6"/><text x="226" y="90" font-size="12" fill="#0e7d76" text-anchor="end" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><polyline points="120,100 120,140" fill="none" stroke="#222" stroke-width="1.6"/><line x1="120" y1="140" x2="120" y2="160" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="48.69840000000001" y="196" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">sense</tspan> = </text><text x="148.7" y="184.52" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><line x1="108.09840000000001" y1="191.52" x2="189.3016" y2="191.52" stroke="#c9561c" stroke-width="1.3"/><text x="148.7" y="205.56" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="120" y="236" font-size="11.5" fill="#6a7079" text-anchor="middle">equal resistors average the outputs</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="177.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="324" font-size="12.5" fill="#222" text-anchor="middle">Resistive sensing: the midpoint is the</text><text x="130.0" y="339" font-size="12.5" fill="#222" text-anchor="middle">average</text><rect x="280" y="30" width="248" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><text x="120.0" y="48" font-size="13" fill="#6a7079" text-anchor="middle">the resistors hang on the outputs:</text><text x="49.665000000000006" y="88" font-size="13.5" fill="#b8382a" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">v</tspan> = g<tspan baseline-shift="sub" font-size="75%">m1</tspan>(r<tspan baseline-shift="sub" font-size="75%">O1</tspan> || r<tspan baseline-shift="sub" font-size="75%">O3</tspan> || R)</text><text x="120.0" y="128" font-size="13" fill="#6a7079" text-anchor="middle">small R → gain drops</text><text x="120.0" y="168" font-size="13" fill="#6a7079" text-anchor="middle">fix: buffer the outputs first</text><text x="45.61500000000001" y="208" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">sense</tspan> = average − V<tspan baseline-shift="sub" font-size="75%">GS</tspan></text><text x="120.0" y="248" font-size="13" fill="#6a7079" text-anchor="middle">(source followers M5, M6)</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="324" font-size="12.5" fill="#222" text-anchor="middle">Its cost, and the follower fix</text><rect x="10" y="368" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="386" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Average with two equal resistors; buffer with followers so they do not load the outputs</text></svg>