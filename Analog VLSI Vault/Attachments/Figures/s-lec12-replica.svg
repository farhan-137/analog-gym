<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 416" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="574" height="416" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Replica CMFB</text><rect x="6" y="30" width="268" height="294" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><text x="30" y="30" font-size="12" fill="#6b4fbb" text-anchor="start" font-weight="600">sensing (real):</text><polyline points="70,50 170,50" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="58,62 58,98" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="52,65 52,95" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="58,68 70,68 70,50" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="58,92 70,92 70,110" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="52,80 38,80" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="69,92 61,88 61,96" fill="#6b4fbb"/><text x="35" y="84" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">out1</tspan></text><text x="78" y="84" font-size="12" fill="#6b4fbb" text-anchor="start" font-weight="600">M12</text><polyline points="182,62 182,98" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="188,65 188,95" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="182,68 170,68 170,50" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="182,92 170,92 170,110" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="188,80 202,80" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="171,92 179,88 179,96" fill="#6b4fbb"/><text x="205" y="84" font-size="12" fill="#6b4fbb" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><text x="162" y="84" font-size="12" fill="#6b4fbb" text-anchor="end" font-weight="600">M13</text><polyline points="70,110 70,122 170,122 170,110" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,122 120,130" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,130 130,130" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,134 126,134" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,138 122,138" fill="none" stroke="#222" stroke-width="1.6"/><text x="30" y="168" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">replica:</text><polyline points="120,172 120,180" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="108,192 108,228" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="102,195 102,225" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="108,198 120,198 120,180" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="108,222 120,222 120,240" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="102,210 88,210" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="119,222 111,218 111,226" fill="#0e7d76"/><text x="85" y="214" font-size="12" fill="#0e7d76" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text><text x="128" y="214" font-size="13" fill="#0e7d76" text-anchor="start" font-weight="600">M15</text><polyline points="120,240 120,248" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,248 130,248" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,252 126,252" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,256 122,256" fill="none" stroke="#222" stroke-width="1.6"/><text x="130.0" y="272" font-size="11.5" fill="#222" text-anchor="middle" font-weight="600">(W/L)₁₅ = (W/L)₁₂ + (W/L)₁₃, same current</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="291.0" y="185.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="140.0" y="340" font-size="12.5" fill="#222" text-anchor="middle">A twin of the sensing devices, with V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text><text x="140.0" y="355" font-size="12.5" fill="#222" text-anchor="middle">on its gate</text><rect x="300" y="30" width="268" height="294" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,34)"><text x="130.0" y="60" font-size="13" fill="#6a7079" text-anchor="middle">balanced only when</text><text x="65.13840000000002" y="112" font-size="14" fill="#2e7d4f" font-weight="600" xml:space="preserve"></text><text x="107.74000000000001" y="100.52" font-size="12.04" fill="#2e7d4f" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><line x1="67.13840000000002" y1="107.52" x2="148.3416" y2="107.52" stroke="#2e7d4f" stroke-width="1.3"/><text x="107.74000000000001" y="121.56" font-size="12.04" fill="#2e7d4f" text-anchor="middle" font-weight="600">2</text><text x="150.3416" y="112" font-size="14" fill="#2e7d4f" font-weight="600" xml:space="preserve"> = V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text><text x="130.0" y="164" font-size="13" fill="#6a7079" text-anchor="middle">M17, M18 copy M1, M2</text><text x="130.0" y="216" font-size="13" fill="#6a7079" text-anchor="middle">so V<tspan baseline-shift="sub" font-size="75%">DS</tspan> matches too (no copy error)</text></g><circle cx="314" cy="44" r="10" fill="#c9561c"/><text x="314" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="434.0" y="340" font-size="12.5" fill="#222" text-anchor="middle">The loop settles where the twins match</text><rect x="10" y="384" width="554" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="287.0" y="402" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Build a twin with V<tspan baseline-shift="sub" font-size="75%">REF</tspan> on its gate: the outputs must average to V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text></svg>