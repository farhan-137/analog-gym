y="174" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M4</text><circle cx="120" cy="200" r="3" fill="#222"/><text x="128" y="204" font-size="12" fill="#b8382a" text-anchor="start" font-weight="600">X (pinned)</text><polyline points="108,212 108,248" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="102,215 102,245" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="108,218 120,218 120,200" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="108,242 120,242 120,260" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="102,230 82,230" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="119,242 111,238 111,246" fill="#6b4fbb"/><text x="128" y="234" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M2</text><polyline points="120,260 120,268" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,268 130,268" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,272 126,272" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,276 122,276" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,140 200,140 200,276 70,276 70,230 102,230" fill="none" stroke="#2e7d4f" stroke-width="2.2"/><text x="206" y="210" font-size="11" fill="#2e7d4f" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><text x="206" y="224" font-size="11" fill="#2e7d4f" text-anchor="start">→ M2 gate</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="190.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="350" font-size="12.5" fill="#222" text-anchor="middle">The telescopic as a buffer: V<tspan baseline-shift="sub" font-size="75%">out</tspan> is</text><text x="130.0" y="365" font-size="12.5" fill="#222" text-anchor="middle">also M2’s gate</text><rect x="280" y="30" width="248" height="304" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><text x="120.0" y="24" font-size="13" fill="#222" text-anchor="middle" font-weight="600">where V<tspan baseline-shift="sub" font-size="75%">out</tspan> may sit</text><rect x="40" y="41.99999999999997" width="24" height="40.00000000000003" fill="#f9e3df" stroke="#b8382a"/><rect x="40" y="82.0" width="24" height="50.0" fill="#e2f1e7" stroke="#2e7d4f"/><rect x="40" y="132.0" width="24" height="40.0" fill="#f9e3df" stroke="#b8382a"/><polyline points="64,62.0 74,62.0" fill="none" stroke="#222" stroke-width="2"/><text x="78" y="66.0" font-size="12" fill="#222" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">b1</tspan></text><polyline points="64,82.0 74,82.0" fill="none" stroke="#c9561c" stroke-width="2"/><text x="78" y="86.0" font-size="12" fill="#c9561c" text-anchor="start" font-weight="600">ceiling = X + V<tspan baseline-shift="sub" font-size="75%">th2</tspan></text><polyline points="64,132.0 74,132.0" fill="none" stroke="#6b4fbb" stroke-width="2"/><text x="78" y="136.0" font-size="12" fill="#6b4fbb" text-anchor="start" font-weight="600">floor = V<tspan baseline-shift="sub" font-size="75%">b1</tspan> − V<tspan baseline-shift="sub" font-size="75%">th4</tspan></text><polyline points="64,152.0 74,152.0" fill="none" stroke="#b8382a" stroke-width="2"/><text x="78" y="156.0" font-size="12" fill="#b8382a" text-anchor="start" font-weight="600">X = V<tspan baseline-shift="sub" font-size="75%">b1</tspan> − V<tspan baseline-shift="sub" font-size="75%">GS4</tspan></text><text x="36" y="57.00000000000003" font-size="10" fill="#b8382a" text-anchor="end">M2</text><text x="36" y="162.0" font-size="10" fill="#b8382a" text-anchor="end">M4</text><text x="120.0" y="282" font-size="11" fill="#6a7079" text-anchor="middle">red = a device falls into triode</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="350" font-size="12.5" fill="#222" text-anchor="middle">Two fences squeeze the output</text><rect x="6" y="388" width="248" height="304" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,392)"><text x="49.375" y="60" font-size="12.5" fill="#222" xml:space="preserve">width = ceiling − floor</text><text x="20.749999999999986" y="106" font-size="12.5" fill="#222" xml:space="preserve">= (V<tspan baseline-shift="sub" font-size="75%">b1</tspan> − V<tspan baseline-shift="sub" font-size="75%">GS4</tspan> + V<tspan baseline-shift="sub" font-size="75%">th2</tspan>) − (V<tspan baseline-shift="sub" font-size="75%">b1</tspan> − V<tspan baseline-shift="sub" font-size="75%">th4</tspan>)</text><text x="62.50000000000001" y="152" font-size="12.5" fill="#c9561c" font-weight="600" xml:space="preserve">= V<tspan baseline-shift="sub" font-size="75%">th</tspan> − V<tspan baseline-shift="sub" font-size="75%">ov4</tspan> ≈ 0.5 V</text><text x="120.0" y="198" font-size="13" fill="#6a7079" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">b1</tspan> cancels: it only slides the window</text><text x="120.0" y="244" font-size="13" fill="#6a7079" text-anchor="middle">fix → fold the cascode (Lec 5)</text></g><circle cx="20" cy="402" r="10" fill="#c9561c"/><text x="20" y="406.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="130.0" y="708" font-size="12.5" fill="#222" text-anchor="middle">The width of the window</text><rect x="10" y="752" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="770" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">M4 wants V<tspan baseline-shift="sub" font-size="75%">out</tspan> high, M2 wants it low: only V<tspan baseline-shift="sub" font-size="75%">th</tspan> − V<tspan baseline-shift="sub" font-size="75%">ov</tspan> is left</text></svg>