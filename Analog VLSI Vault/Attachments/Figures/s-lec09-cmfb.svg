<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 772" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="534" height="772" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Common-mode feedback</text><rect x="6" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><polyline points="80,30 160,30" fill="none" stroke="#222" stroke-width="2.2"/><text x="164" y="34" font-size="11" fill="#6a7079" text-anchor="start">VDD</text><circle cx="120" cy="70" r="12" fill="#fff" stroke="#222" stroke-width="1.6"/><line x1="120" y1="64" x2="120" y2="77" stroke="#222" stroke-width="1.5" marker-end="url(#ah222)"/><text x="136" y="74" font-size="12" fill="#222" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">P</tspan></text><polyline points="120,30 120,58" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,82 120,160" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="120" cy="120" r="3" fill="#222"/><text x="128" y="116" font-size="12" fill="#c9561c" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><circle cx="120" cy="172" r="12" fill="#fff" stroke="#222" stroke-width="1.6"/><line x1="120" y1="166" x2="120" y2="179" stroke="#222" stroke-width="1.5" marker-end="url(#ah222)"/><text x="136" y="176" font-size="12" fill="#222" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">N</tspan></text><polyline points="120,184 120,192" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,192 130,192" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,196 126,196" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,200 122,200" fill="none" stroke="#222" stroke-width="1.6"/><line x1="150" y1="124" x2="196" y2="124" stroke="#b8382a" stroke-width="2" marker-end="url(#ahb8382a)"/><text x="158" y="142" font-size="11" fill="#b8382a" text-anchor="start">I<tspan baseline-shift="sub" font-size="75%">P</tspan> − I<tspan baseline-shift="sub" font-size="75%">N</tspan></text><text x="120" y="236" font-size="11.5" fill="#6a7079" text-anchor="middle">any mismatch flows into a huge R</text><text x="120" y="254" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">→ output CM runs to a rail</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="187.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Two current sources in series set no</text><text x="130.0" y="359" font-size="12.5" fill="#222" text-anchor="middle">voltage</text><rect x="280" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><rect x="20" y="60" width="90" height="44" rx="6" fill="#eeeaf8" stroke="#6b4fbb"/><text x="65" y="80" font-size="12" fill="#6b4fbb" text-anchor="middle" font-weight="600">sense</text><text x="65" y="96" font-size="10.5" fill="#6b4fbb" text-anchor="middle">output CM</text><rect x="140" y="60" width="90" height="44" rx="6" fill="#fbeadf" stroke="#c9561c"/><text x="185" y="80" font-size="12" fill="#c9561c" text-anchor="middle" font-weight="600">compare</text><text x="185" y="96" font-size="10.5" fill="#c9561c" text-anchor="middle">with V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text><rect x="80" y="160" width="90" height="44" rx="6" fill="#e2f2f0" stroke="#0e7d76"/><text x="125" y="180" font-size="12" fill="#0e7d76" text-anchor="middle" font-weight="600">correct</text><text x="125" y="196" font-size="10.5" fill="#0e7d76" text-anchor="middle">one current source</text><line x1="110" y1="82" x2="138" y2="82" stroke="#222" stroke-width="2" marker-end="url(#ah222)"/><line x1="185" y1="104" x2="160" y2="158" stroke="#222" stroke-width="2" marker-end="url(#ah222)"/><line x1="90" y1="160" x2="65" y2="106" stroke="#222" stroke-width="2" marker-end="url(#ah222)"/><text x="120" y="246" font-size="12" fill="#6a7079" text-anchor="middle">ordinary negative feedback</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">What CMFB does</text><rect x="6" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="45.47840000000001" y="60" font-size="14" fill="#222" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">out,CM</tspan> = </text><text x="151.92" y="48.519999999999996" font-size="12.04" fill="#222" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><line x1="111.3184" y1="55.519999999999996" x2="192.52159999999998" y2="55.519999999999996" stroke="#222" stroke-width="1.3"/><text x="151.92" y="69.56" font-size="12.04" fill="#222" text-anchor="middle" font-weight="600">2</text><text x="120.0" y="110" font-size="13" fill="#6a7079" text-anchor="middle">what CMFB holds at V<tspan baseline-shift="sub" font-size="75%">REF</tspan></text><text x="120.0" y="160" font-size="13" fill="#6a7079" text-anchor="middle">differential signals cancel in the sum</text><text x="57.510000000000005" y="210" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve">error ≈ </text><text x="149.4" y="201.52" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">1</text><line x1="118.31" y1="205.52" x2="180.49" y2="205.52" stroke="#c9561c" stroke-width="1.3"/><text x="149.4" y="219.56" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">loop gain</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="130.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">What it senses</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Sense the output CM, compare with V<tspan baseline-shift="sub" font-size="75%">REF</tspan>, correct one current source</text></svg>