<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 692" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="594" height="692" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Rail-to-rail input = an NMOS pair + a PMOS pair</text><rect x="6" y="30" width="278" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><polyline points="10,22 240,22" fill="none" stroke="#222" stroke-width="2.2"/><text x="244" y="26" font-size="11" fill="#6a7079" text-anchor="start">VDD</text><polyline points="10,236 250,236" fill="none" stroke="#222" stroke-width="2.2"/><text x="254" y="240" font-size="11" fill="#6a7079" text-anchor="start">0</text><rect x="10" y="46" width="112" height="54" rx="6" fill="#eeeaf8" stroke="#6b4fbb"/><text x="66" y="68" font-size="12.5" fill="#6b4fbb" text-anchor="middle" font-weight="600">NMOS pair</text><text x="66" y="86" font-size="12" fill="#6b4fbb" text-anchor="middle">M1, M2</text><rect x="10" y="162" width="112" height="54" rx="6" fill="#e2f2f0" stroke="#0e7d76"/><text x="66" y="184" font-size="12.5" fill="#0e7d76" text-anchor="middle" font-weight="600">PMOS pair</text><text x="66" y="202" font-size="12" fill="#0e7d76" text-anchor="middle">M3, M4</text><rect x="160" y="52" width="92" height="156" rx="6" fill="#f3efe6" stroke="#c9c2b2"/><text x="206" y="116" font-size="12.5" fill="#222" text-anchor="middle" font-weight="600">cascode</text><text x="206" y="132" font-size="12.5" fill="#222" text-anchor="middle" font-weight="600">branches</text><text x="206" y="150" font-size="12" fill="#6a7079" text-anchor="middle">M5–M12</text><line x1="122" y1="72" x2="158" y2="72" stroke="#6b4fbb" stroke-width="2" marker-end="url(#ah6b4fbb)"/><line x1="122" y1="190" x2="158" y2="190" stroke="#0e7d76" stroke-width="2" marker-end="url(#ah0e7d76)"/><text x="140" y="64" font-size="10.5" fill="#6b4fbb" text-anchor="middle">fold</text><text x="140" y="182" font-size="10.5" fill="#0e7d76" text-anchor="middle">fold</text><text x="66" y="136" font-size="12" fill="#c9561c" text-anchor="middle" font-weight="600">same V<tspan baseline-shift="sub" font-size="75%">in1</tspan>, V<tspan baseline-shift="sub" font-size="75%">in2</tspan></text><line x1="66" y1="124" x2="66" y2="102" stroke="#c9561c" stroke-width="1.5" marker-end="url(#ahc9561c)"/><line x1="66" y1="142" x2="66" y2="160" stroke="#c9561c" stroke-width="1.5" marker-end="url(#ahc9561c)"/></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="145.0" y="304" font-size="12.5" fill="#222" text-anchor="middle">Both pairs fold into the same cascodes</text><rect x="310" y="30" width="278" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(314,34)"><text x="143.0" y="26" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Which pair is on?</text><rect x="22" y="66" width="150" height="22" rx="4" fill="#e2f2f0" stroke="#0e7d76"/><text x="30" y="81" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">PMOS pair works</text><rect x="100" y="112" width="150" height="22" rx="4" fill="#eeeaf8" stroke="#6b4fbb"/><text x="242" y="127" font-size="12" fill="#6b4fbb" text-anchor="end" font-weight="600">NMOS pair works</text><polyline points="30,170 252,170" fill="none" stroke="#6a7079" stroke-width="1.4"/><polyline points="30,170 30,170" fill="none" stroke="#6a7079" stroke-width="1.4"/><text x="30" y="188" font-size="11" fill="#6a7079" text-anchor="middle">0</text><text x="240" y="188" font-size="11" fill="#6a7079" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="135" y="188" font-size="11" fill="#6a7079" text-anchor="middle">input CM →</text><polyline points="33,205 97,205" fill="none" stroke="#6a7079" stroke-width="1.2"/><text x="65.0" y="222" font-size="11.5" fill="#222" text-anchor="middle">PMOS only</text><polyline points="103,205 169,205" fill="none" stroke="#6a7079" stroke-width="1.2"/><text x="136.0" y="222" font-size="11.5" fill="#222" text-anchor="middle">both</text><polyline points="175,205 247,205" fill="none" stroke="#6a7079" stroke-width="1.2"/><text x="211.0" y="222" font-size="11.5" fill="#222" text-anchor="middle">NMOS only</text><polyline points="100,60 100,170" fill="none" stroke="#6a7079" stroke-width="1" stroke-dasharray="3 3"/><polyline points="172,60 172,170" fill="none" stroke="#6a7079" stroke-width="1" stroke-dasharray="3 3"/></g><circle cx="324" cy="44" r="10" fill="#c9561c"/><text x="324" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="449.0" y="304" font-size="12.5" fill="#222" text-anchor="middle">Near 0 V the PMOS pair, near V<tspan baseline-shift="sub" font-size="75%">DD</tspan> the NMOS</text><text x="449.0" y="319" font-size="12.5" fill="#222" text-anchor="middle">pair</text><rect x="6" y="342" width="278" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,346)"><text x="143.0" y="26" font-size="13" fill="#222" text-anchor="middle" font-weight="600">G<tspan baseline-shift="sub" font-size="75%">m</tspan> (and gain) vs input CM</text><polyline points="40,200 252,200" fill="none" stroke="#6a7079" stroke-width="1.4"/><polyline points="40,200 40,50" fill="none" stroke="#6a7079" stroke-width="1.4"/><text x="252" y="216" font-size="12" fill="#6a7079" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">in,CM</tspan></text><text x="44" y="52" font-size="12" fill="#6a7079" text-anchor="start">G<tspan baseline-shift="sub" font-size="75%">m</tspan></text><polyline points="40,150 100,150 100,90 172,90 172,150 250,150" fill="none" stroke="#c9561c" stroke-width="2.4"/><text x="34" y="154" font-size="12" fill="#c9561c" text-anchor="end">g<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="34" y="94" font-size="12" fill="#c9561c" text-anchor="end">2g<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="136" y="82" font-size="11.5" fill="#6a7079" text-anchor="middle">both on</text><text x="135.0" y="232" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">the gain is NOT constant over the range</text></g><circle cx="20" cy="356" r="10" fill="#c9561c"/><text x="20" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="145.0" y="616" font-size="12.5" fill="#222" text-anchor="middle">Where both work, G<tspan baseline-shift="sub" font-size="75%">m</tspan> doubles</text><rect x="310" y="342" width="278" height="258" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(314,346)"><text x="135.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Each pair’s own range (Lec 6)</text><text x="18.494999999999962" y="70" font-size="13.5" fill="#0e7d76" font-weight="600" xml:space="preserve">PMOS: below 0 V → V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">ov</tspan>| − |V<tspan baseline-shift="sub" font-size="75%">GS</tspan>|</text><text x="135.0" y="100" font-size="12" fill="#6a7079" text-anchor="middle">its floor passes ground</text><text x="44.145000000000024" y="130" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">NMOS: V<tspan baseline-shift="sub" font-size="75%">ov</tspan> + V<tspan baseline-shift="sub" font-size="75%">GS</tspan> → above V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="135.0" y="160" font-size="12" fill="#6a7079" text-anchor="middle">its ceiling passes V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="135.0" y="190" font-size="13" fill="#222" text-anchor="middle" font-weight="600">together: 0 V → V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="135.0" y="220" font-size="12" fill="#6a7079" text-anchor="middle">any input CM works</text></g><circle cx="324" cy="356" r="10" fill="#c9561c"/><text x="324" y="360.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="449.0" y="616" font-size="12.5" fill="#222" text-anchor="middle">Why the two ranges cover everything</text><rect x="10" y="660" width="574" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="297.0" y="678" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Each pair covers the rail the other cannot reach</text></svg>