b4fbb" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">G1</tspan></text><circle cx="200" cy="70" r="3" fill="#222"/><text x="200" y="60" font-size="12" fill="#c9561c" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><circle cx="200" cy="170" r="3" fill="#222"/><text x="200" y="194" font-size="12" fill="#6b4fbb" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">G2</tspan></text><polyline points="60,70 200,70" fill="none" stroke="#c9561c" stroke-width="1.6" stroke-dasharray="3 3"/><polyline points="60,170 200,170" fill="none" stroke="#6b4fbb" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="130" cy="70" r="3" fill="#c9561c"/><circle cx="130" cy="170" r="3" fill="#6b4fbb"/><text x="60.37280000000001" y="100" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">out,CM</tspan> = </text><text x="159.64000000000001" y="88.84" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan></text><line x1="121.65280000000001" y1="95.84" x2="197.62720000000002" y2="95.84" stroke="#c9561c" stroke-width="1.3"/><text x="159.64000000000001" y="109.02000000000001" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="73.6484" y="148" font-size="13" fill="#6b4fbb" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">in,CM</tspan> = </text><text x="156.64999999999998" y="136.84" font-size="11.18" fill="#6b4fbb" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">G1</tspan> + V<tspan baseline-shift="sub" font-size="75%">G2</tspan></text><line x1="128.9484" y1="143.84" x2="184.3516" y2="143.84" stroke="#6b4fbb" stroke-width="1.3"/><text x="156.64999999999998" y="157.02" font-size="11.18" fill="#6b4fbb" text-anchor="middle" font-weight="600">2</text><text x="140.0" y="234" font-size="12.5" fill="#222" text-anchor="middle" font-weight="600">CM = the average of a pair</text><text x="140.0" y="252" font-size="11.5" fill="#6a7079" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">2</tspan>, R<tspan baseline-shift="sub" font-size="75%">4</tspan> carry no DC → the two are equal</text></g><circle cx="334" cy="44" r="10" fill="#c9561c"/><text x="334" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="464.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Output CM = average of the outputs; input CM =</text><text x="464.0" y="359" font-size="12.5" fill="#222" text-anchor="middle">average of the gates</text><rect x="6" y="382" width="288" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The seesaw: the average stays put</text><polyline points="30,230 260,230" fill="none" stroke="#6a7079" stroke-width="1.4"/><polyline points="30,230 30,50" fill="none" stroke="#6a7079" stroke-width="1.4"/><text x="260" y="246" font-size="12" fill="#6a7079" text-anchor="end">t</text><polyline points="30.0,140.0 32.8,135.6 35.6,131.3 38.4,127.0 41.2,122.8 44.1,118.7 46.9,114.8 49.7,111.1 52.5,107.7 55.3,104.4 58.1,101.5 60.9,98.8 63.8,96.5 66.6,94.5 69.4,92.9 72.2,91.6 75.0,90.7 77.8,90.1 80.6,90.0 83.4,90.2 86.2,90.9 89.1,91.9 91.9,93.3 94.7,95.0 97.5,97.1 100.3,99.5 103.1,102.2 105.9,105.2 108.8,108.5 111.6,112.1 114.4,115.8 117.2,119.7 120.0,123.8 122.8,128.1 125.6,132.4 128.4,136.7 131.2,141.1 134.1,145.5 136.9,149.8 139.7,154.1 142.5,158.3 145.3,162.3 148.1,166.1 150.9,169.8 153.8,173.2 156.6,176.3 159.4,179.2 162.2,181.8 165.0,184.0 167.8,185.9 170.6,187.5 173.4,188.7 176.2,189.5 179.1,189.9 181.9,190.0 184.7,189.6 187.5,188.9 190.3,187.8 193.1,186.3 195.9,184.5 198.8,182.3 