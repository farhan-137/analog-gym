<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 792" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="614" height="792" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Why two stages: towers at V<tspan baseline-shift="sub" font-size="75%">DD</tspan> = 1.8 V (V<tspan baseline-shift="sub" font-size="75%">ov</tspan> = 0.2 V each)</text><rect x="6" y="30" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Telescopic output column</text><rect x="110" y="238.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="254.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">tail</text><rect x="110" y="214.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="230.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M2</text><rect x="110" y="190.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="206.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M4</text><rect x="110" y="94.0" width="60" height="96.0" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4" stroke-dasharray="4 3"/><text x="140.0" y="146.0" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">room</text><text x="177" y="146.0" font-size="11.5" fill="#2e7d4f" text-anchor="start">0.8 V for V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><rect x="110" y="70.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="86.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M6</text><rect x="110" y="46.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="62.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M8</text><text x="105" y="266" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="105" y="194.0" font-size="11.5" fill="#222" text-anchor="end">0.6</text><text x="105" y="98.0" font-size="11.5" fill="#222" text-anchor="end">1.4</text><text x="105" y="50.0" font-size="11.5" fill="#222" text-anchor="end">1.8</text><text x="140.0" y="290" font-size="11.5" fill="#b8382a" text-anchor="middle" font-weight="600">five blocks of 0.2 V: swing 0.8 V per side</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="311.0" y="192.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="354" font-size="12.5" fill="#222" text-anchor="middle">All five stacked devices share 1.8 V with the</text><text x="150.0" y="369" font-size="12.5" fill="#222" text-anchor="middle">output</text><rect x="320" y="30" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,34)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Stage 2: a CS stage (two devices)</text><rect x="110" y="238.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="254.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M11</text><text x="177" y="254.0" font-size="11.5" fill="#6a7079" text-anchor="start">current source</text><rect x="110" y="70.0" width="60" height="168.0" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4" stroke-dasharray="4 3"/><text x="140.0" y="158.0" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">room</text><text x="177" y="158.0" font-size="11.5" fill="#2e7d4f" text-anchor="start">1.4 V for V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><rect x="110" y="46.0" width="60" height="24.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="140.0" y="62.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M9</text><text x="177" y="62.0" font-size="11.5" fill="#6a7079" text-anchor="start">CS device</text><text x="105" y="266" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="105" y="242.0" font-size="11.5" fill="#222" text-anchor="end">0.2</text><text x="105" y="74.0" font-size="11.5" fill="#222" text-anchor="end">1.6</text><text x="105" y="50.0" font-size="11.5" fill="#222" text-anchor="end">1.8</text><text x="140.0" y="290" font-size="11.5" fill="#2e7d4f" text-anchor="middle" font-weight="600">two blocks: swing 1.4 V, rail to rail minus V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text></g><circle cx="334" cy="44" r="10" fill="#c9561c"/><text x="334" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="464.0" y="354" font-size="12.5" fill="#222" text-anchor="middle">Stage 2 has only two blocks in its column</text><rect x="6" y="392" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,396)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The level between the stages</text><polyline points="80,50 240,50" fill="none" stroke="#222" stroke-width="2.2"/><text x="244" y="54" font-size="11" fill="#6a7079" text-anchor="start">VDD</text><polyline points="168,62 168,98" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="162,65 162,95" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="168,68 180,68 180,50" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="168,92 180,92 180,110" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="162,80 122,80" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="169,68 177,64 177,72" fill="#0e7d76"/><text x="188" y="84" font-size="13" fill="#0e7d76" text-anchor="start" font-weight="600">M9</text><circle cx="180" cy="110" r="3" fill="#222"/><text x="188" y="114" font-size="12" fill="#c9561c" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><polyline points="168,122 168,158" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="162,125 162,155" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="168,128 180,128 180,110" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="168,152 180,152 180,170" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="162,140 148,140" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="179,152 171,148 171,156" fill="#6b4fbb"/><text x="145" y="144" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b</tspan></text><text x="188" y="144" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M11</text><polyline points="180,170 180,178" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="170,178 190,178" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="174,182 186,182" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="178,186 182,186" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="128,80 80,80" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="80" cy="80" r="3" fill="#222"/><text x="72" y="84" font-size="13" fill="#b8382a" text-anchor="end" font-weight="600">X</text><text x="76" y="118" font-size="10.5" fill="#6a7079" text-anchor="middle">(stage-1 output)</text><polyline points="180,52 60,52 60,72" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="60,78 56,70 64,70" fill="#2b6cb0"/><text x="140.0" y="214" font-size="11.5" fill="#2b6cb0" text-anchor="middle" font-weight="600">X is M9’s gate: a link from V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="44.99999999999997" y="240" font-size="12.5" fill="#2b6cb0" font-weight="600" xml:space="preserve">X = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">GS9</tspan>| = 1.8 − 0.7 = 1.1 V</text><text x="140.0" y="266" font-size="11.5" fill="#6a7079" text-anchor="middle">stage 1’s output CM is fixed by stage 2</text></g><circle cx="20" cy="406" r="10" fill="#c9561c"/><text x="20" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="311.0" y="554.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="716" font-size="12.5" fill="#222" text-anchor="middle">Stage 2’s V<tspan baseline-shift="sub" font-size="75%">GS9</tspan> pins the DC level at X (a</text><text x="150.0" y="731" font-size="12.5" fill="#222" text-anchor="middle">link)</text><rect x="320" y="392" width="288" height="308" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,396)"><text x="140.0" y="36" font-size="13" fill="#222" text-anchor="middle" font-weight="600">One stage vs two stages</text><text x="106.72" y="66" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">A = A<tspan baseline-shift="sub" font-size="75%">1</tspan> × A<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="140.0" y="96" font-size="12" fill="#6a7079" text-anchor="middle">telescopic + CS: ≈ (g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan>/2 × g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>/2</text><text x="55.50000000000003" y="126" font-size="13" fill="#2e7d4f" font-weight="600" xml:space="preserve">swing: from 5 blocks to 2</text><text x="140.0" y="156" font-size="12" fill="#6a7079" text-anchor="middle">the output column is just M9 and M11</text><text x="86.05000000000001" y="186" font-size="13" fill="#b8382a" font-weight="600" xml:space="preserve">price: two poles</text><text x="140.0" y="216" font-size="12" fill="#6a7079" text-anchor="middle">X and V<tspan baseline-shift="sub" font-size="75%">out</tspan> are both high-R nodes</text><text x="140.0" y="246" font-size="12" fill="#6a7079" text-anchor="middle">→ compensation (Lec 17)</text></g><circle cx="334" cy="406" r="10" fill="#c9561c"/><text x="334" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="464.0" y="716" font-size="12.5" fill="#222" text-anchor="middle">What the second stage changes</text><rect x="10" y="760" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="778" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Stage 1 gives the gain, stage 2 gives the swing</text></svg>