.4"/><polyline points="92,205 92,235" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="98,208 110,208 110,190" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="98,232 110,232 110,250" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="92,220 80,220" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="109,232 101,228 101,236" fill="#6b4fbb"/><text x="77" y="224" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text><text x="118" y="224" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M2</text><polyline points="98,258 98,294" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="92,261 92,291" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="98,264 110,264 110,246" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="98,288 110,288 110,306" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="92,276 80,276" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="109,288 101,284 101,292" fill="#6b4fbb"/><text x="77" y="280" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b1</tspan></text><text x="118" y="280" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M9</text><polyline points="110,306 110,314" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="100,314 120,314" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="104,318 116,318" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="108,322 112,322" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="110" cy="138" r="3" fill="#222"/><text x="118" y="142" font-size="12" fill="#c9561c" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><circle cx="110" cy="250" r="3" fill="#222"/><text x="118" y="254" font-size="12" fill="#b8382a" text-anchor="start" font-weight="600">P</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="311.0" y="207.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="384" font-size="12.5" fill="#222" text-anchor="middle">The real column: five devices from V<tspan baseline-shift="sub" font-size="75%">DD</tspan> to</text><text x="150.0" y="399" font-size="12.5" fill="#222" text-anchor="middle">ground</text><rect x="320" y="30" width="288" height="338" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,34)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The same column as a tower</text><rect x="70" y="278.0" width="60" height="44.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="100.0" y="304.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M9</text><text x="137" y="304.0" font-size="11.5" fill="#6a7079" text-anchor="start">tail ≥ 0.5</text><rect x="70" y="260.4" width="60" height="17.6" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="100.0" y="273.2" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M2</text><text x="137" y="273.2" font-size="11.5" fill="#6a7079" text-anchor="start">M2 ≥ 0.2</text><rect x="70" y="176.79999999999998" width="60" height="83.6" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="100.0" y="222.59999999999997" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">M4</text><text x="137" y="222.59999999999997" font-size="11.5" fill="#2e7d4f" text-anchor="start">M4 ≥ 0.2</text><rect x="70" y="84.39999999999998" width="60" height="92.4" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="100.0" y="134.59999999999997" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">M6</text><text x="137" y="134.59999999999997" font-size="11.5" fill="#2e7d4f" text-anchor="start">M6 ≥ 0.3</text><rect x="70" y="57.99999999999998" width="60" height="26.4" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="100.0" y="75.19999999999997" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M8</text><text x="137" y="75.19999999999997" font-size="11.5" fill="#6a7079" text-anchor="start">M8 ≥ 0.3</text><text x="65" y="326" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="65" y="282.0" font-size="11.5" fill="#222" text-anchor="end">P</text><text x="65" y="180.79999999999998" font-size="11.5" fill="#222" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><text x="65" y="61.99999999999998" font-size="11.5" fill="#222" text-anchor="end">3 V</text><text x="148.0" y="38" font-size="11.5" fill="#6a7079" text-anchor="middle">height = voltage across that device</text></g><circle cx="334" cy="44" r="10" fill="#c9561c"/><text x="334" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="464.0" y="384" font-size="12.5" fill="#222" text-anchor="middle">Each device becomes a block; the blocks stack</text><text x="464.0" y="399" font-size="12.5" fill="#222" text-anchor="middle">to 3 V</text><rect x="6" y="422" width="288" height="338" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,426)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Slide V<tspan baseline-shift="sub" font-size="75%">out</tspan> until a block hits its minimum</text><rect x="46" y="270.0" width="52" height="42.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="72.0" y="295.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M9</text><rect x="46" y="253.2" width="52" height="16.8" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="72.0" y="265.6" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M2</text><rect x="46" y="110.4" width="52" height="142.79999999999998" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="72.0" y="185.8" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">M4</text><rect x="46" y="85.2" width="52" height="25.2" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="72.0" y="101.80000000000001" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M6</text><rect x="46" y="60.0" width="52" height="25.2" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="72.0" y="76.60000000000001" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M8</text><text x="41" y="316" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="41" y="114.4" font-size="11.5" fill="#222" text-anchor="end">top 2.4</text><rect x="188" y="270.0" width="52" height="42.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="214.0" y="295.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M9</text><rect x="188" y="253.2" width="52" height="16.8" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="214.0" y="265.6" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M2</text><rect x="188" y="236.39999999999998" width="52" height="16.8" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="214.0" y="248.79999999999998" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M4</text><rect x="188" y="85.19999999999996" width="52" height="151.20000000000002" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="214.0" y="164.79999999999995" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">M6</text><rect x="188" y="59.99999999999996" width="52" height="25.2" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="214.0" y="76.59999999999997" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M8</text><text x="183" y="240.39999999999998" font-size="11.5" fill="#222" text-anchor="end">bottom 0.9</text><text x="72" y="44" font-size="11.5" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan> at its top</text><text x="214" y="44" font-size="11.5" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan> at its bottom</text></g><circle cx="20" cy="436" r="10" fill="#c9561c"/><text x="20" y="440.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="311.0" y="599.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="776" font-size="12.5" fill="#222" text-anchor="middle">Top: M6 squeezed. Bottom: M4 squeezed</text><rect x="320" y="422" width="288" height="338" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,426)"><text x="140.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Reading rules (every tower)</text><text x="14" y="66" font-size="12.2" fill="#222" text-anchor="start">1  one block = one transistor</text><text x="14" y="92" font-size="12.2" fill="#222" text-anchor="start">2  height = top node − bottom node</text><text x="14" y="118" font-size="12.2" fill="#222" text-anchor="start">3  the blocks always add up to V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="14" y="144" font-size="12.2" fill="#222" text-anchor="start">4  no block may be shorter than its V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><text x="14" y="170" font-size="12.2" fill="#222" text-anchor="start">5  move V<tspan baseline-shift="sub" font-size="75%">out</tspan>: the block above shrinks,</text><text x="14" y="196" font-size="12.2" fill="#222" text-anchor="start">    the block below grows (or vice versa)</text><text x="14" y="222" font-size="12.2" fill="#b8382a" text-anchor="start">6  a red block = squeezed to its minimum</text><text x="14" y="248" font-size="12.2" fill="#b8382a" text-anchor="start">    = that device is the limit</text><text x="140.0" y="274" font-size="13" fill="#222" text-anchor="middle" font-weight="600">swing = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − all minimum blocks</text><text x="32.75" y="300" font-size="13" fill="#2e7d4f" font-weight="600" xml:space="preserve">= 3 − (0.3+0.3+0.2+0.2+0.5) = 1.5 V</text></g><circle cx="334" cy="436" r="10" fill="#c9561c"/><text x="334" y="440.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="464.0" y="776" font-size="12.5" fill="#222" text-anchor="middle">Six rules that read every tower in this course</text><rect x="10" y="820" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="838" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">A limit is always: which block gets squeezed first?</text></svg>