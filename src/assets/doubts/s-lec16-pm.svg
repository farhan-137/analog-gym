<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 772" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="574" height="772" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">Why small phase margin means peaking</text><rect x="6" y="30" width="268" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><line x1="60" y1="90" x2="150" y2="90" stroke="#222" stroke-width="2.2" marker-end="url(#ah222)"/><text x="105.0" y="82" font-size="13" fill="#222" text-anchor="middle">1</text><line x1="150" y1="90" x2="72.05771365940052" y2="135.0" stroke="#6b4fbb" stroke-width="2.2" marker-end="url(#ah6b4fbb)"/><text x="121.02885682970026" y="112.5" font-size="13" fill="#6b4fbb" text-anchor="start">βA</text><line x1="60" y1="90" x2="72.05771365940052" y2="135.0" stroke="#c9561c" stroke-width="2.6" marker-end="url(#ahc9561c)"/><text x="58.02885682970026" y="116.5" font-size="12" fill="#c9561c" text-anchor="end">1 + βA</text><text x="120" y="30" font-size="14" fill="#222" text-anchor="middle" font-weight="600">PM = 30°</text><text x="35.97400000000002" y="250" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">|1 + βA| = 2 sin(</text><text x="143.39999999999998" y="241.84" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">PM</text><line x1="131.57399999999998" y1="245.84" x2="155.226" y2="245.84" stroke="#c9561c" stroke-width="1.3"/><text x="143.39999999999998" y="259.02" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="157.226" y="250" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">) = 0.52</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Small PM: the arrows nearly cancel → big</text><text x="140.0" y="359" font-size="12.5" fill="#222" text-anchor="middle">peak</text><rect x="300" y="30" width="268" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,34)"><line x1="60" y1="90" x2="150" y2="90" stroke="#222" stroke-width="2.2" marker-end="url(#ah222)"/><text x="105.0" y="82" font-size="13" fill="#222" text-anchor="middle">1</text><line x1="150" y1="90" x2="105.00000000000001" y2="167.94228634059948" stroke="#6b4fbb" stroke-width="2.2" marker-end="url(#ah6b4fbb)"/><text x="137.5" y="128.97114317029974" font-size="13" fill="#6b4fbb" text-anchor="start">βA</text><line x1="60" y1="90" x2="105.00000000000001" y2="167.94228634059948" stroke="#c9561c" stroke-width="2.6" marker-end="url(#ahc9561c)"/><text x="74.5" y="132.97114317029974" font-size="12" fill="#c9561c" text-anchor="end">1 + βA</text><text x="120" y="30" font-size="14" fill="#222" text-anchor="middle" font-weight="600">PM = 60°</text><text x="37.92400000000001" y="250" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">|1 + βA| = 2 sin(</text><text x="145.34999999999997" y="241.84" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">PM</text><line x1="133.52399999999997" y1="245.84" x2="157.176" y2="245.84" stroke="#c9561c" stroke-width="1.3"/><text x="145.34999999999997" y="259.02" font-size="11.18" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="159.176" y="250" font-size="13" fill="#c9561c" font-weight="600" xml:space="preserve">) = 1.00</text></g><circle cx="314" cy="44" r="10" fill="#c9561c"/><text x="314" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="434.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">60°: |1 + βA| = 1 → no peak</text><rect x="6" y="382" width="268" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="20.202000000000012" y="60" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">at ω<tspan baseline-shift="sub" font-size="75%">GX</tspan>:  |A<tspan baseline-shift="sub" font-size="75%">closed</tspan>| = </text><text x="181.29" y="51.68" font-size="11.61" fill="#6b4fbb" text-anchor="middle" font-weight="600">1/β</text><line x1="144.782" y1="55.68" x2="217.798" y2="55.68" stroke="#6b4fbb" stroke-width="1.3"/><text x="181.29" y="69.28999999999999" font-size="11.61" fill="#6b4fbb" text-anchor="middle" font-weight="600">2 sin(PM/2)</text><text x="120.0" y="110" font-size="13" fill="#6a7079" text-anchor="middle">PM 30° → 1.93/β (big peak)</text><text x="120.0" y="160" font-size="13" fill="#6a7079" text-anchor="middle">PM 45° → 1.3/β</text><text x="120.0" y="210" font-size="13" fill="#6a7079" text-anchor="middle">PM 60° → 1.0/β (no peak)</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Numbers to remember</text><rect x="10" y="740" width="554" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="287.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">K = 1/(2 sin(PM/2)): 45° → 1.3, 60° → 1.0</text></svg>