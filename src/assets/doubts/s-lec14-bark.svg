<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 420" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="534" height="420" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">When feedback turns into oscillation</text><rect x="6" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><circle cx="50" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.6"/><text x="50" y="105" font-size="14" fill="#222" text-anchor="middle">Σ</text><rect x="90" y="78" width="60" height="44" rx="6" fill="#eeeaf8" stroke="#6b4fbb"/><text x="120" y="106" font-size="18" fill="#6b4fbb" text-anchor="middle" font-weight="600">A</text><line x1="64" y1="100" x2="88" y2="100" stroke="#222" stroke-width="2" marker-end="url(#ah222)"/><line x1="150" y1="100" x2="222" y2="100" stroke="#222" stroke-width="2" marker-end="url(#ah222)"/><rect x="90" y="160" width="60" height="40" rx="6" fill="#fbeadf" stroke="#c9561c"/><text x="120" y="186" font-size="18" fill="#c9561c" text-anchor="middle" font-weight="600">β</text><polyline points="200,100 200,180 152,180" fill="none" stroke="#c9561c" stroke-width="1.8"/><polyline points="90,180 50,180" fill="none" stroke="#c9561c" stroke-width="1.8"/><line x1="50" y1="180" x2="50" y2="116" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="58" y="140" font-size="16" fill="#c9561c" text-anchor="start">−</text><text x="120.0" y="230" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">round the loop: |βA| = 1, phase −180°</text><text x="120.0" y="250" font-size="11.5" fill="#6a7079" text-anchor="middle">plus the − at Σ: another 180°</text><text x="120.0" y="268" font-size="11.5" fill="#b8382a" text-anchor="middle">→ the signal returns in phase</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="187.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Follow a signal once round the loop</text><rect x="280" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><text x="36.000000000000014" y="50" font-size="14" fill="#b8382a" font-weight="600" xml:space="preserve">|βA| = 1  and  ∠βA = −180°</text><text x="50.70000000000002" y="98" font-size="14" fill="#222" xml:space="preserve">⇒ βA = −1 ⇒ 1 + βA = 0</text><text x="53.226" y="146" font-size="14" fill="#b8382a" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">closed</tspan> = </text><text x="139.32" y="137.52" font-size="12.04" fill="#b8382a" text-anchor="middle" font-weight="600">A</text><line x1="119.066" y1="141.52" x2="159.574" y2="141.52" stroke="#b8382a" stroke-width="1.3"/><text x="139.32" y="155.56" font-size="12.04" fill="#b8382a" text-anchor="middle" font-weight="600">1 + βA</text><text x="161.574" y="146" font-size="14" fill="#b8382a" font-weight="600" xml:space="preserve"> → ∞</text><text x="120.0" y="194" font-size="13" fill="#6a7079" text-anchor="middle">it oscillates by itself</text><text x="120.0" y="242" font-size="13" fill="#6a7079" text-anchor="middle">one pole reaches only −90°: always safe</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Barkhausen: the oscillation condition</text><rect x="10" y="388" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="406" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Gain 1 at −180° = an oscillator</text></svg>