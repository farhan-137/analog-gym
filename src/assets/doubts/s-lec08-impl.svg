line-shift="sub" font-size="75%">2</tspan></text><polyline points="70,20 70,40" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="70,64 70,100 150,100" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="70" cy="100" r="3" fill="#222"/><polyline points="178,82 178,118" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="172,85 172,115" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="178,88 190,88 190,70" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="178,112 190,112 190,130" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="172,100 144,100" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="189,112 181,108 181,116" fill="#6b4fbb"/><text x="198" y="104" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M2</text><polyline points="190,70 190,40" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="190" cy="50" r="3" fill="#222"/><text x="198" y="46" font-size="12" fill="#c9561c" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><circle cx="190" cy="130" r="3" fill="#222"/><text x="198" y="140" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">X</text><polyline points="202,142 202,178" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="208,145 208,175" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="202,148 190,148 190,130" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="202,172 190,172 190,190" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="208,160 228,160" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="191,172 199,168 199,176" fill="#6b4fbb"/><text x="231" y="164" font-size="12" fill="#6b4fbb" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text><text x="182" y="164" font-size="13" fill="#6b4fbb" text-anchor="end" font-weight="600">M1</text><polyline points="190,190 190,198" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="180,198 200,198" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="184,202 196,202" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="188,206 192,206" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="82,142 82,178" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="88,145 88,175" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="82,148 70,148 70,130" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="82,172 70,172 70,190" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="88,160 108,160" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="71,172 79,168 79,176" fill="#6b4fbb"/><text x="60" y="164" font-size="13" fill="#6b4fbb" text-anchor="end" font-weight="600">M3</text><polyline points="70,100 70,130" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="108,160 130,160 130,130 190,130" fill="none" stroke="#c9561c" stroke-width="1.8"/><polyline points="70,190 70,198" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="60,198 80,198" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="64,202 76,202" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="68,206 72,206" fill="none" stroke="#222" stroke-width="1.6"/><text x="140.0" y="236" font-size="11.5" fill="#6a7079" text-anchor="middle">M3’s gate sits on X, its drain drives M2’s gate</text><text x="102.2" y="262" font-size="13.5" fill="#c9561c" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">1</tspan> = g<tspan baseline-shift="sub" font-size="75%">m3</tspan> r<tspan baseline-shift="sub" font-size="75%">O3</tspan></text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="311.0" y="187.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Implementation 1: a CS booster (M3 + I₂)</text><rect x="320" y="30" width="288" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,34)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Plain cascode: X needs only V<tspan baseline-shift="sub" font-size="75%">ov1</tspan></text><rect x="120" y="220.0" width="60" height="30.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="150.0" y="239.0" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M1</text><text x="187" y="239.0" font-size="11.5" fill="#6a7079" text-anchor="start">M1 ≥ 0.2</text><rect x="120" y="190.0" width="60" height="30.0" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="150.0" y="209.0" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M2</text><text x="187" y="209.0" font-size="11.5" fill="#b8382a" text-anchor="start" font-weight="600">M2 ≥ 0.2</text><text x="115" y="254" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="115" y="224.0" font-size="11.5" fill="#222" text-anchor="end">X 0.2</text><text x="115" y="194.0" font-size="11.5" fill="#222" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">out,min</tspan> 0.4</text><text x="140.0" y="280" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out,min</tspan> = V<tspan baseline-shift="sub" font-size="75%">ov1</tspan> + V<tspan baseline-shift="sub" font-size="75%">ov2</tspan> = 0.4 V</text></g><circle cx="334" cy="44" r="10" fill="#c9561c"/><text x="334" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="464.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Without a booster X can sit just 0.2 V up</text><rect x="6" y="382" width="288" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="148.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">CS booster: X must hold M3’s gate up</text><rect x="120" y="145.0" width="60" height="105.0" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="150.0" y="201.5" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">M1</text><text x="187" y="201.5" font-size="11.5" fill="#2e7d4f" text-anchor="start">X = V<tspan baseline-shift="sub" font-size="75%">GS3</tspan> = 0.7</text><rect x="120" y="115.0" width="60" height="30.0" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="150.0" y="134.0" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M2</text><text x="187" y="134.0" font-size="11.5" fill="#b8382a" text-anchor="start" font-weight="600">M2 ≥ 0.2</text><text x="115" y="254" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="115" y="149.0" font-size="11.5" fill="#222" text-anchor="end">X 0.7</text><text x="115" y="119.0" font-size="11.5" fill="#222" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">out,min</tspan> 0.9</text><text x="140.0" y="280" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out,min</tspan> = V<tspan baseline-shift="sub" font-size="75%">GS3</tspan> + V<tspan baseline-shift="sub" font-size="75%">ov2</tspan> = 0.9 V</text><text x="140.0" y="46" font-size="11.5" fill="#2b6cb0" text-anchor="middle" font-weight="600">X is M3’s gate: a link, X = V<tspan baseline-shift="sub" font-size="75%">GS3</tspan></text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="311.0" y="539.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="150.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">With it, X is M3’s gate: a whole 0.7 V</text><rect x="320" y="382" width="288" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(324,386)"><text x="140.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The three boosters</text><text x="86.05000000000001" y="72" font-size="13" fill="#6b4fbb" font-weight="600" xml:space="preserve">1. CS: A<tspan baseline-shift="sub" font-size="75%">1</tspan> = g<tspan baseline-shift="sub" font-size="75%">m3</tspan> r<tspan baseline-shift="sub" font-size="75%">O3</tspan></text><text x="140.0" y="104" font-size="12" fill="#6a7079" text-anchor="middle">works, but costs V<tspan baseline-shift="sub" font-size="75%">th</tspan> of swing</text><text x="52.50999999999999" y="136" font-size="13" fill="#b8382a" font-weight="600" xml:space="preserve">2. PMOS: needs V<tspan baseline-shift="sub" font-size="75%">GS2</tspan> ≤ |V<tspan baseline-shift="sub" font-size="75%">th3</tspan>|</text><text x="140.0" y="168" font-size="12" fill="#6a7079" text-anchor="middle">M2 would barely be on ✗</text><text x="46.790000000000006" y="200" font-size="13" fill="#2e7d4f" font-weight="600" xml:space="preserve">3. folded: A<tspan baseline-shift="sub" font-size="75%">1</tspan> = g<tspan baseline-shift="sub" font-size="75%">m3</tspan> g<tspan baseline-shift="sub" font-size="75%">m4</tspan> r<tspan baseline-shift="sub" font-size="75%">O3</tspan> r<tspan baseline-shift="sub" font-size="75%">O4</tspan></text><text x="140.0" y="232" font-size="12" fill="#6a7079" text-anchor="middle">no swing cost, bigger boost ✓</text></g><circle cx="334" cy="396" r="10" fill="#c9561c"/><text x="334" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="464.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Pick the folded booster when swing matters</text><rect x="10" y="740" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">The CS booster’s M1 block is stuck at V<tspan baseline-shift="sub" font-size="75%">GS3</tspan>: half a volt of swing gone</text></svg>