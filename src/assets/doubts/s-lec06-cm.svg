sub" font-size="75%">thp</tspan>|</text><text x="140.0" y="258" font-size="13" fill="#222" text-anchor="middle" font-weight="600">below ground: −0.3 V!</text></g><circle cx="334" cy="406" r="10" fill="#c9561c"/><text x="334" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="464.0" y="716" font-size="12.5" fill="#222" text-anchor="middle">Check, then link: the method for every CM</text><text x="464.0" y="731" font-size="12.5" fill="#222" text-anchor="middle">limit</text><rect x="10" y="760" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="778" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Folding puts X near ground, so V<tspan baseline-shift="sub" font-size="75%">in</tspan> can go below ground</text></svg>