b4fbb" stroke-width="2"/><polyline points="108,78 120,78 120,60" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="108,102 120,102 120,120" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="102,90 90,90" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="119,102 111,98 111,106" fill="#6b4fbb"/><text x="87" y="94" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b2</tspan></text><text x="128" y="94" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M4</text><circle cx="120" cy="120" r="3" fill="#222"/><polyline points="120,120 120,130" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="108,142 108,178" fill="none" stroke="#6b4fbb" stroke-width="2.4"/><polyline points="102,145 102,175" fill="none" stroke="#6b4fbb" stroke-width="2"/><polyline points="108,148 120,148 120,130" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="108,172 120,172 120,190" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polyline points="102,160 90,160" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><polygon points="119,172 111,168 111,176" fill="#6b4fbb"/><text x="87" y="164" font-size="12" fill="#6b4fbb" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b1</tspan></text><text x="128" y="164" font-size="13" fill="#6b4fbb" text-anchor="start" font-weight="600">M10</text><polyline points="120,190 120,198" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,198 130,198" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,202 126,202" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,206 122,206" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="212,82 212,118" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="218,85 218,115" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="212,88 200,88 200,70" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="212,112 200,112 200,130" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="218,100 238,100" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="211,88 203,84 203,92" fill="#0e7d76"/><text x="192" y="104" font-size="13" fill="#0e7d76" text-anchor="end" font-weight="600">M2</text><polyline points="200,130 200,140 120,140 120,120" fill="none" stroke="#c9561c" stroke-width="1.8"/><polyline points="200,70 200,56" fill="none" stroke="#222" stroke-width="1.6"/><text x="206" y="62" font-size="11" fill="#6a7079" text-anchor="start">tail</text><polyline points="238,100 248,100 248,46 120,46" fill="none" stroke="#c9561c" stroke-width="1.8"/><text x="186" y="40" font-size="11.5" fill="#c9561c" text-anchor="middle" font-weight="600">gate = V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><text x="136" y="226" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">fold = V<tspan baseline-shift="sub" font-size="75%">b2</tspan> − V<tspan baseline-shift="sub" font-size="75%">GS4</tspan></text><line x1="136" y1="212" x2="124" y2="146" stroke="#b8382a" stroke-width="1.4" marker-end="url(#ahb8382a)"/></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="291.0" y="172.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="140.0" y="314" font-size="12.5" fill="#222" text-anchor="middle">Output tied to M2’s gate (the “−” input)</text><rect x="300" y="30" width="268" height="268" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,34)"><text x="130.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">M4 (NMOS) saturated</text><text x="130.0" y="70" font-size="12" fill="#6a7079" text-anchor="middle">drain ≥ gate − V<tspan baseline-shift="sub" font-size="75%">th</tspan></text><text x="76.81" y="100" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">out</tspan> ≥ V<tspan baseline-shift="sub" font-size="75%">b2</tspan> − V<tspan baseline-shift="sub" font-size="75%">th4</tspan></text><text x="130.0" y="130" font-size="12" fill="#6a7079" text-anchor="middle">page: 0.8 − 0.4 = 0.4 V</text><text x="130.0" y="160" font-size="13" fill="#222" text-anchor="middle" font-weight="600">M2 (PMOS) saturated</text><text x="130.0" y="190" font-size="12" fill="#6a7079" text-anchor="middle">drain ≤ gate + |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text><text x="51.29499999999999" y="220" font-size="13.5" fill="#0e7d76" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">b2</tspan> − V<tspan baseline-shift="sub" font-size="75%">GS4</tspan> ≤ V<tspan baseline-shift="sub" font-size="75%">out</tspan> + |V<tspan baseline-shift="sub" font-size="75%">th2</tspan>|</text><text x="48.359999999999985" y="250" font-size="13" fill="#0e7d76" font-weight="600" xml:space="preserve">⇒ V<tspan baseline-shift="sub" font-size="75%">out</tspan> ≥ V<tspan baseline-shift="sub" font-size="75%">b2</tspan> − V<tspan baseline-shift="sub" font-size="75%">GS4</tspan> − |V<tspan baseline-shift="sub" font-size="75%">th2</tspan>|</text></g><circle cx="314" cy="44" r="10" fill="#c9561c"/><text x="314" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="434.0" y="314" font-size="12.5" fill="#222" text-anchor="middle">Write each device’s fence with V<tspan baseline-shift="sub" font-size="75%">out</tspan> as</text><text x="434.0" y="329" font-size="12.5" fill="#222" text-anchor="middle">M2’s gate</text><rect x="6" y="352" width="268" height="268" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,356)"><text x="138.0" y="26" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Both are floors: keep the higher</text><polyline points="40,215.0 40,37.72727272727275" fill="none" stroke="#6a7079" stroke-width="2"/><polyline points="32,65.0 48,65.0" fill="none" stroke="#222" stroke-width="2"/><text x="54" y="69.0" font-size="12" fill="#222" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">b2</tspan> = 0.8 V</text><polyline points="32,119.54545454545455 48,119.54545454545455" fill="none" stroke="#2e7d4f" stroke-width="2"/><text x="54" y="123.54545454545455" font-size="12" fill="#2e7d4f" text-anchor="start">M4 floor = 0.4 V  ← binds</text><polyline points="32,174.0909090909091 48,174.0909090909091" fill="none" stroke="#6a7079" stroke-width="2"/><text x="54" y="178.0909090909091" font-size="12" fill="#6a7079" text-anchor="start">0 V</text><polyline points="32,215.0 48,215.0" fill="none" stroke="#6a7079" stroke-width="2"/><text x="54" y="219.0" font-size="12" fill="#6a7079" text-anchor="start">M2 floor = −0.3 V</text><rect x="46" y="63.0" width="8" height="56.54545454545455" rx="2" fill="#e2f1e7" stroke="#2e7d4f"/><text x="160.0" y="240" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out</tspan> must stay above 0.4 V</text></g><circle cx="20" cy="366" r="10" fill="#c9561c"/><text x="20" y="370.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="291.0" y="494.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="140.0" y="636" font-size="12.5" fill="#222" text-anchor="middle">Put both floors on one ladder</text><rect x="300" y="352" width="268" height="268" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,356)"><text x="130.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Telescopic buffer (Lec 3–4)</text><text x="130.0" y="70" font-size="12" fill="#6a7079" text-anchor="middle">M4 gives a floor, M2 gives a CEILING</text><text x="46.02999999999999" y="100" font-size="13.5" fill="#b8382a" font-weight="600" xml:space="preserve">window = V<tspan baseline-shift="sub" font-size="75%">th</tspan> − V<tspan baseline-shift="sub" font-size="75%">ov</tspan>  (tiny)</text><text x="130.0" y="130" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Folded buffer (Lec 6)</text><text x="130.0" y="160" font-size="12" fill="#6a7079" text-anchor="middle">M2’s drain is the fold node, pinned</text><text x="130.0" y="190" font-size="12" fill="#6a7079" text-anchor="middle">by V<tspan baseline-shift="sub" font-size="75%">b2</tspan> in another column</text><text x="29.42500000000001" y="220" font-size="13.5" fill="#2e7d4f" font-weight="600" xml:space="preserve">both are floors → wide range</text></g><circle cx="314" cy="366" r="10" fill="#c9561c"/><text x="314" y="370.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="434.0" y="636" font-size="12.5" fill="#222" text-anchor="middle">Why this is far better than the telescopic</text><rect x="10" y="680" width="554" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="287.0" y="698" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Two fences, both floors: the higher one is the real limit</text></svg>