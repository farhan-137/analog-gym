pan baseline-shift="sub" font-size="75%">out</tspan> is multiplied</text><rect x="280" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,386)"><text x="43.41999999999999" y="56" font-size="14" fill="#222" xml:space="preserve">plain cascode: (g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="120.0" y="104" font-size="13" fill="#6a7079" text-anchor="middle">one-transistor booster: A<tspan baseline-shift="sub" font-size="75%">1</tspan> ≈ g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><text x="72.82000000000001" y="152" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve">gain ≈ (g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">3</tspan></text><text x="70.44" y="200" font-size="14" fill="#2e7d4f" font-weight="600" xml:space="preserve">G<tspan baseline-shift="sub" font-size="75%">m</tspan> stays ≈ g<tspan baseline-shift="sub" font-size="75%">m1</tspan></text><text x="120.0" y="248" font-size="13" fill="#6a7079" text-anchor="middle">no extra device in the output stack</text></g><circle cx="294" cy="396" r="10" fill="#c9561c"/><text x="294" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="404.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">The payoff</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Boosting multiplies R<tspan baseline-shift="sub" font-size="75%">out</tspan> by (1 + A<tspan baseline-shift="sub" font-size="75%">1</tspan>) without stacking another device</text></svg>