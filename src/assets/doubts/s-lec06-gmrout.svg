xt x="188" y="66" font-size="12.5" fill="#c9561c" text-anchor="start" font-weight="600">v<tspan baseline-shift="sub" font-size="75%">out</tspan></text><polyline points="80,70 80,106" fill="none" stroke="#222" stroke-width="1.6"/><polygon points="80,106 92,120 80,134 68,120" fill="#fff" stroke="#c9561c" stroke-width="1.6"/><line x1="80" y1="113" x2="80" y2="128" stroke="#c9561c" stroke-width="1.4" marker-end="url(#ahc9561c)"/><text x="96" y="124" font-size="12" fill="#c9561c" text-anchor="start">G<tspan baseline-shift="sub" font-size="75%">m</tspan> v<tspan baseline-shift="sub" font-size="75%">in</tspan></text><polyline points="80,134 80,180 180,180" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="180,70 180,78 185,85.83333333333333 175,101.5 185,117.16666666666666 175,132.83333333333331 185,148.5 175,164.16666666666666 180,172 180,180" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><text x="190" y="129.0" font-size="12" fill="#6b4fbb" text-anchor="start">R<tspan baseline-shift="sub" font-size="75%">out</tspan></text><polyline points="130,180 130,188" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,188 140,188" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="124,192 136,192" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="128,196 132,196" fill="none" stroke="#222" stroke-width="1.6"/><text x="64.4804" y="216" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">v</tspan> = </text><text x="114.04" y="204.52" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">v<tspan baseline-shift="sub" font-size="75%">out</tspan></text><line x1="98.1204" y1="211.52" x2="129.9596" y2="211.52" stroke="#c9561c" stroke-width="1.3"/><text x="114.04" y="225.56" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">v<tspan baseline-shift="sub" font-size="75%">in</tspan></text><text x="131.9596" y="216" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve"> = G<tspan baseline-shift="sub" font-size="75%">m</tspan> R<tspan baseline-shift="sub" font-size="75%">out</tspan></text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="291.0" y="157.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="140.0" y="284" font-size="12.5" fill="#222" text-anchor="middle">A current G<tspan baseline-shift="sub" font-size="75%">m</tspan> v<tspan baseline-shift="sub" font-size="75%">in</tspan> pushed into R<tspan baseline-shift="sub" font-size="75%">out</tspan></text><rect x="300" y="30" width="268" height="238" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(304,34)"><text x="130.0" y="36" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Which factor can grow?</text><text x="84.66640000000001" y="64" font-size="13.5" fill="#6a7079" xml:space="preserve">G<tspan baseline-shift="sub" font-size="75%">m</tspan> ≈ g<tspan baseline-shift="sub" font-size="75%">m</tspan> = </text><text x="160.51" y="52.68" font-size="11.61" fill="#6a7079" text-anchor="middle">2I<tspan baseline-shift="sub" font-size="75%">D</tspan></text><line x1="147.6864" y1="59.68" x2="173.3336" y2="59.68" stroke="#6a7079" stroke-width="1.3"/><text x="160.51" y="73.28999999999999" font-size="11.61" fill="#6a7079" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><text x="130.0" y="92" font-size="12" fill="#6a7079" text-anchor="middle">more G<tspan baseline-shift="sub" font-size="75%">m</tspan> costs current (power)</text><text x="41.575" y="120" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">R<tspan baseline-shift="sub" font-size="75%">out</tspan>: each cascode × g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><text x="130.0" y="148" font-size="12" fill="#6a7079" text-anchor="middle">but each one costs a V<tspan baseline-shift="sub" font-size="75%">ov</tspan> of swing</text><text x="130.0" y="176" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Lec 7: add a 2nd stage</text><text x="130.0" y="204" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Lec 7–8: boost R<tspan baseline-shift="sub" font-size="75%">out</tspan> by (1 + A<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text></g><circle cx="314" cy="44" r="10" fill="#c9561c"/><text x="314" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="434.0" y="284" font-size="12.5" fill="#222" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">out</tspan> is the factor to raise</text><rect x="10" y="328" width="554" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="287.0" y="346" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">More gain = bigger R<tspan baseline-shift="sub" font-size="75%">out</tspan> without stacking more devices</text></svg>