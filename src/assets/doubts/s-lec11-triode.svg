 stroke-width="1.3"/><text x="38.500000000000014" y="110.75" font-size="10.75" fill="#6b4fbb" text-anchor="middle" font-weight="600">R<tspan baseline-shift="sub" font-size="75%">tot</tspan></text><text x="55.14250000000001" y="102" font-size="12.5" fill="#6b4fbb" font-weight="600" xml:space="preserve"> = µ<tspan baseline-shift="sub" font-size="75%">nC</tspan><tspan baseline-shift="sub" font-size="75%">ox</tspan>(W/L)(V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan> − 2V<tspan baseline-shift="sub" font-size="75%">th</tspan>)</text><text x="140.0" y="146" font-size="13" fill="#6a7079" text-anchor="middle">a differential signal raises one and lowers</text><text x="140.0" y="190" font-size="13" fill="#6a7079" text-anchor="middle">the other: the sum is unchanged</text><text x="58.875000000000014" y="234" font-size="12.5" fill="#2e7d4f" font-weight="600" xml:space="preserve">→ R<tspan baseline-shift="sub" font-size="75%">tot</tspan> senses only the CM</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="150.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Two in parallel sense the CM</text><rect x="10" y="740" width="594" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="307.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Deep triode = resistor; in parallel only V<tspan baseline-shift="sub" font-size="75%">out1</tspan> + V<tspan baseline-shift="sub" font-size="75%">out2</tspan> matters</text></svg>