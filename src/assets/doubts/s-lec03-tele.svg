nt-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan></text><rect x="6" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><polyline points="30,80 210,80" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="120" cy="80" r="3" fill="#222"/><text x="120" y="70" font-size="12" fill="#c9561c" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text><polygon points="45,126 57,140 45,154 33,140" fill="#fff" stroke="#c9561c" stroke-width="1.6"/><line x1="45" y1="133" x2="45" y2="148" stroke="#c9561c" stroke-width="1.4" marker-end="url(#ahc9561c)"/><text x="61" y="144" font-size="12" fill="#c9561c" text-anchor="start">g<tspan baseline-shift="sub" font-size="75%">m2</tspan> v<tspan baseline-shift="sub" font-size="75%">in</tspan></text><polyline points="45,80 45,126" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="45,154 45,210" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,80 120,88 125,97.5 115,116.5 125,135.5 115,154.5 125,173.5 115,192.5 120,202 120,210" fill="none" stroke="#6b4fbb" stroke-width="1.6"/><text x="130" y="149.0" font-size="12" fill="#6b4fbb" text-anchor="start">R<tspan baseline-shift="sub" font-size="75%">down</tspan></text><polyline points="180,80 180,88 185,97.5 175,116.5 185,135.5 175,154.5 185,173.5 175,192.5 180,202 180,210" fill="none" stroke="#0e7d76" stroke-width="1.6"/><text x="190" y="149.0" font-size="12" fill="#0e7d76" text-anchor="start">R<tspan baseline-shift="sub" font-size="75%">up</tspan></text><polyline points="30,210 200,210" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="120,210 120,218" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="110,218 130,218" fill="none" stroke="#222" stroke-width="1.8"/><polyline points="114,222 126,222" fill="none" stroke="#222" stroke-width="1.6"/><polyline points="118,226 122,226" fill="none" stroke="#222" stroke-width="1.6"/></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="271.0" y="539.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Output node: g<tspan baseline-shift="sub" font-size="75%">m</tspan> v<tspan baseline-shift="sub" font-size="75%">in</tspan> into R<tspan baseline-shift="sub" font-size="75%">down</tspan> || R<tspan baseline-shift="sub" font-size="75%">up</tspan></text><rect x="280" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,386)"><text x="59.660000000000004" y="50" font-size="14" fill="#6b4fbb" font-weight="600" xml:space="preserve">A = g<tspan baseline-shift="sub" font-size="75%">m</tspan>(R<tspan baseline-shift="sub" font-size="75%">down</tspan> || R<tspan baseline-shift="sub" font-size="75%">up</tspan>)</text><text x="55.60000000000001" y="98" font-size="14" fill="#222" xml:space="preserve">R<tspan baseline-shift="sub" font-size="75%">down</tspan> ≈ R<tspan baseline-shift="sub" font-size="75%">up</tspan> ≈ g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="120.0" y="146" font-size="13" fill="#6a7079" text-anchor="middle">two equal resistors in || = half</text><text x="80.69120000000001" y="194" font-size="14" fill="#c9561c" font-weight="600" xml:space="preserve">A = </text><text x="132.60000000000002" y="182.52" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">(g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan></text><line x1="107.89120000000001" y1="189.52" x2="157.30880000000002" y2="189.52" stroke="#c9561c" stroke-width="1.3"/><text x="132.60000000000002" y="203.56" font-size="12.04" fill="#c9561c" text-anchor="middle" font-weight="600">2</text><text x="120.0" y="242" font-size="13" fill="#6a7079" text-anchor="middle">g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan> = 50  →  A ≈ 1250 (5-T: 25)</text></g><circle cx="294" cy="396" r="10" fill="#c9561c"/><text x="294" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="404.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Square the intrinsic gain, then halve</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Cascoding keeps G<tspan baseline-shift="sub" font-size="75%">m</tspan> = g<tspan baseline-shift="sub" font-size="75%">m</tspan> and multiplies R<tspan baseline-shift="sub" font-size="75%">out</tspan> by g<tspan baseline-shift="sub" font-size="75%">m</tspan> r<tspan baseline-shift="sub" font-size="75%">O</tspan> on both sides</text></svg>