ke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="42" y="120" font-size="12" fill="#c9561c" text-anchor="end" font-weight="600">+i</text><line x1="166" y1="98" x2="166" y2="126" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="162" y="120" font-size="12" fill="#c9561c" text-anchor="end" font-weight="600">+i</text><line x1="166" y1="196" x2="166" y2="178" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="162" y="192" font-size="12" fill="#c9561c" text-anchor="end" font-weight="600">−i</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="187.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Follow a small v<tspan baseline-shift="sub" font-size="75%">d</tspan> through the circuit</text><rect x="280" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><polyline points="40,110 200,110" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="120" cy="110" r="3" fill="#222"/><text x="76" y="132" font-size="12" fill="#222" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">out</tspan> node</text><line x1="70" y1="50" x2="100" y2="104" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="46" y="46" font-size="12" fill="#c9561c" text-anchor="start">M4 copies M1: +i in</text><line x1="140" y1="116" x2="172" y2="176" stroke="#c9561c" stroke-width="2" marker-end="url(#ahc9561c)"/><text x="132" y="196" font-size="12" fill="#c9561c" text-anchor="start">M2 takes i less out</text><text x="132" y="212" font-size="12" fill="#c9561c" text-anchor="start">= another +i in</text><rect x="40" y="230" width="160" height="36" rx="6" fill="#e2f1e7" stroke="#2e7d4f"/><text x="120" y="253" font-size="13" fill="#2e7d4f" text-anchor="middle" font-