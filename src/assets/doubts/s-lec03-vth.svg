<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 772" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah222" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#222"/></marker><marker id="ahc9561c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c9561c"/></marker><marker id="ah6b4fbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b4fbb"/></marker><marker id="ah0e7d76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0e7d76"/></marker><marker id="ah2e7d4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2e7d4f"/></marker><marker id="ahb8382a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8382a"/></marker><marker id="ah6a7079" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6a7079"/></marker></defs><rect width="534" height="772" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="700" fill="#222">The diode tax: count the V<tspan baseline-shift="sub" font-size="75%">th</tspan>’s</text><rect x="6" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,34)"><text x="120.0" y="24" font-size="13" fill="#222" text-anchor="middle" font-weight="600">one PMOS: what |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| does</text><polyline points="60,125.0 60,251.0" fill="none" stroke="#6a7079" stroke-width="2"/><polyline points="52,125.0 68,125.0" fill="none" stroke="#222" stroke-width="2"/><text x="74" y="129.0" font-size="12" fill="#222" text-anchor="start" font-weight="600">source 3.0 V</text><polyline points="52,157.39999999999998 68,157.39999999999998" fill="none" stroke="#2e7d4f" stroke-width="2"/><text x="74" y="161.39999999999998" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="600">highest drain</text><polyline points="52,229.39999999999998 68,229.39999999999998" fill="none" stroke="#0e7d76" stroke-width="2"/><text x="74" y="233.39999999999998" font-size="12" fill="#0e7d76" text-anchor="start" font-weight="600">gate 1.84 V</text><rect x="30" y="125.0" width="16" height="32.39999999999999" fill="#fbeadf" stroke="#c9561c"/><text x="26" y="145.20000000000002" font-size="11" fill="#c9561c" text-anchor="end">|V<tspan baseline-shift="sub" font-size="75%">ov</tspan>|</text><rect x="30" y="157.39999999999998" width="16" height="72.0" fill="#f9e3df" stroke="#b8382a"/><text x="26" y="197.39999999999998" font-size="11" fill="#b8382a" text-anchor="end">|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text><text x="74" y="197.39999999999998" font-size="11" fill="#6a7079" text-anchor="start">drain may sit here:</text><text x="74" y="211.39999999999998" font-size="11" fill="#6a7079" text-anchor="start">up to |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| above gate</text></g><circle cx="20" cy="44" r="10" fill="#c9561c"/><text x="20" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="271.0" y="187.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="130.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">The gate pays |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|; the drain only</text><text x="130.0" y="359" font-size="12.5" fill="#222" text-anchor="middle">needs |V<tspan baseline-shift="sub" font-size="75%">ov</tspan>|</text><rect x="280" y="30" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(284,34)"><text x="120.0" y="24" font-size="13" fill="#222" text-anchor="middle" font-weight="600">fully differential (V<tspan baseline-shift="sub" font-size="75%">b2</tspan> chosen)</text><rect x="30" y="45.0" width="64" height="25.2" fill="#e2f2f0" stroke="#0e7d76"/><text x="62" y="61.6" font-size="11" fill="#0e7d76" text-anchor="middle" font-weight="600">M8 V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><rect x="30" y="70.2" width="64" height="25.2" fill="#e2f2f0" stroke="#0e7d76"/><text x="62" y="86.8" font-size="11" fill="#0e7d76" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><rect x="30" y="95.4" width="64" height="56.0" fill="#f9e3df" stroke="#b8382a"/><text x="62" y="127.4" font-size="11" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">th</tspan></text><text x="20" y="49.0" font-size="10.5" fill="#6a7079" text-anchor="end">3 V</text><polyline points="30,151.4 220,151.4" fill="none" stroke="#0e7d76" stroke-width="1.6" stroke-dasharray="4 3"/><text x="222" y="165.4" font-size="11" fill="#0e7d76" text-anchor="end">M6 gate 1.48 V</text><line x1="140" y1="151.4" x2="140" y2="97.4" stroke="#2e7d4f" stroke-width="2" marker-end="url(#ah2e7d4f)"/><text x="146" y="127.4" font-size="11" fill="#2e7d4f" text-anchor="start" font-weight="600">+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text><polyline points="130,95.4 222,95.4" fill="none" stroke="#2e7d4f" stroke-width="2"/><text x="222" y="90.4" font-size="11" fill="#2e7d4f" text-anchor="end" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out,max</tspan> 2.28 V</text><text x="120.0" y="280" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">1 taken, 1 given back → 0 lost</text></g><circle cx="294" cy="44" r="10" fill="#c9561c"/><text x="294" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="404.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Walk down to M6’s gate, then back up to</text><text x="404.0" y="359" font-size="12.5" fill="#222" text-anchor="middle">its drain</text><rect x="6" y="382" width="248" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="120.0" y="24" font-size="13" fill="#222" text-anchor="middle" font-weight="600">diode stack M7, M5</text><rect x="30" y="45.0" width="64" height="25.2" fill="#e2f2f0" stroke="#0e7d76"/><text x="62" y="61.6" font-size="11" fill="#0e7d76" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><rect x="30" y="70.2" width="64" height="56.0" fill="#f9e3df" stroke="#b8382a"/><text x="62" y="102.2" font-size="11" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">th</tspan></text><rect x="30" y="126.2" width="64" height="25.2" fill="#e2f2f0" stroke="#0e7d76"/><text x="62" y="142.8" font-size="11" fill="#0e7d76" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">ov</tspan></text><rect x="30" y="151.4" width="64" height="56.0" fill="#f9e3df" stroke="#b8382a"/><text x="62" y="183.4" font-size="11" fill="#b8382a" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">th</tspan></text><text x="20" y="49.0" font-size="10.5" fill="#6a7079" text-anchor="end">3 V</text><polyline points="30,207.4 220,207.4" fill="none" stroke="#0e7d76" stroke-width="1.6" stroke-dasharray="4 3"/><text x="222" y="221.4" font-size="11" fill="#0e7d76" text-anchor="end">M6 gate 0.68 V</text><line x1="140" y1="207.4" x2="140" y2="153.4" stroke="#2e7d4f" stroke-width="2" marker-end="url(#ah2e7d4f)"/><text x="146" y="183.4" font-size="11" fill="#2e7d4f" text-anchor="start" font-weight="600">+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text><polyline points="130,151.4 222,151.4" fill="none" stroke="#2e7d4f" stroke-width="2"/><text x="222" y="146.4" font-size="11" fill="#2e7d4f" text-anchor="end" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">out,max</tspan> 1.48 V</text><text x="120.0" y="280" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">2 taken, 1 given back → 1 lost</text></g><circle cx="20" cy="396" r="10" fill="#c9561c"/><text x="20" y="400.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="130.0" y="696" font-size="12.5" fill="#222" text-anchor="middle">Two diodes: one |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| never comes back</text><text x="130.0" y="711" font-size="12.5" fill="#222" text-anchor="middle">= the diode tax</text><rect x="10" y="740" width="514" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="267.0" y="758" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">Each V<tspan baseline-shift="sub" font-size="75%">GS</tspan> on the way down costs a V<tspan baseline-shift="sub" font-size="75%">th</tspan>; the drain gives one back. Leftover = the tax</text></svg>