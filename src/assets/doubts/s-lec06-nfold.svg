ine-shift="sub" font-size="75%">up</tspan> = g<tspan baseline-shift="sub" font-size="75%">m8</tspan> r<tspan baseline-shift="sub" font-size="75%">O8</tspan> (r<tspan baseline-shift="sub" font-size="75%">O10</tspan> || r<tspan baseline-shift="sub" font-size="75%">O2</tspan>)</text><text x="135.0" y="100" font-size="12" fill="#6a7079" text-anchor="middle">two r<tspan baseline-shift="sub" font-size="75%">O</tspan> hang on the fold node, as before</text><text x="135.0" y="133" font-size="13" fill="#222" text-anchor="middle" font-weight="600">look down: a plain NMOS cascode</text><text x="75.60000000000001" y="166" font-size="13.5" fill="#6b4fbb" font-weight="600" xml:space="preserve">R<tspan baseline-shift="sub" font-size="75%">down</tspan> = g<tspan baseline-shift="sub" font-size="75%">m6</tspan> r<tspan baseline-shift="sub" font-size="75%">O6</tspan> r<tspan baseline-shift="sub" font-size="75%">O4</tspan></text><text x="135.0" y="199" font-size="13" fill="#222" text-anchor="middle" font-weight="600">gain</text><text x="62.370000000000005" y="232" font-size="13.5" fill="#c9561c" font-weight="600" xml:space="preserve">A<tspan baseline-shift="sub" font-size="75%">v</tspan> = g<tspan baseline-shift="sub" font-size="75%">m1,2</tspan> (R<tspan baseline-shift="sub" font-size="75%">up</tspan> || R<tspan baseline-shift="sub" font-size="75%">down</tspan>)</text></g><circle cx="324" cy="44" r="10" fill="#c9561c"/><text x="324" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="449.0" y="344" font-size="12.5" fill="#222" text-anchor="middle">Gain by the same two looks</text><rect x="6" y="382" width="278" height="298" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,386)"><text x="143.0" y="22" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Ceiling: V<tspan baseline-shift="sub" font-size="75%">in</tspan> up → S up → M2 squeezed</text><rect x="140" y="112.0" width="50" height="133.0" fill="#dcefe2" stroke="#2e7d4f" stroke-width="1.4"/><text x="165.0" y="182.5" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="600">tail</text><text x="197" y="182.5" font-size="11.5" fill="#2e7d4f" text-anchor="start">1.4 plenty</text><rect x="140" y="93.0" width="50" height="19.0" fill="#f6d5d0" stroke="#b8382a" stroke-width="1.4"/><text x="165.0" y="106.5" font-size="12" fill="#b8382a" text-anchor="middle" font-weight="600">M2</text><text x="197" y="106.5" font-size="11.5" fill="#b8382a" text-anchor="start" font-weight="600">0.2 squeezed</text><rect x="140" y="74.0" width="50" height="19.0" fill="#ececec" stroke="#6a7079" stroke-width="1.4"/><text x="165.0" y="87.5" font-size="12" fill="#6a7079" text-anchor="middle" font-weight="600">M10</text><text x="197" y="87.5" font-size="11.5" fill="#6a7079" text-anchor="start">0.2</text><text x="135" y="249" font-size="11.5" fill="#222" text-anchor="end">0</text><text x="135" y="116.0" font-size="11.5" fill="#222" text-anchor="end">S 1.4</text><text x="135" y="78.0" font-size="11.5" fill="#222" text-anchor="end">1.8</text><text x="135" y="95.0" font-size="10.5" fill="#222" text-anchor="end">fold 1.6</text><polyline points="76,112.0 58,112.0 58,51.5" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="58,45.5 54,53.5 62,53.5" fill="#2b6cb0"/><polyline points="8,45.5 138,45.5" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="4 3"/><text x="8" y="40.5" font-size="12" fill="#2b6cb0" text-anchor="start" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">in</tspan> 2.1 (above V<tspan baseline-shift="sub" font-size="75%">DD</tspan>!)</text><text x="135.0" y="268" font-size="11.5" fill="#2b6cb0" text-anchor="middle" font-weight="600">V<tspan baseline-shift="sub" font-size="75%">in</tspan> = S + 0.7 = 1.4 + 0.7 = 2.1 V</text><text x="135.0" y="288" font-size="11.5" fill="#b8382a" text-anchor="middle" font-weight="600">floor: tail squeezed, S = 0.2 → V<tspan baseline-shift