middle">to X</text><rect x="310" y="30" width="278" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(314,34)"><text x="143.0" y="26" font-size="13" fill="#222" text-anchor="middle" font-weight="600">The voltages, top down</text><polyline points="40,236 40,46" fill="none" stroke="#6a7079" stroke-width="2"/><polyline points="32,46 48,46" fill="none" stroke="#222" stroke-width="2"/><text x="54" y="50" font-size="12" fill="#222" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><polyline points="32,72.6 48,72.6" fill="none" stroke="#0e7d76" stroke-width="2"/><text x="54" y="76.6" font-size="12" fill="#0e7d76" text-anchor="start">P max = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">ov7</tspan>|</text><polyline points="32,125.80000000000001 48,125.80000000000001" fill="none" stroke="#b8382a" stroke-width="2"/><text x="54" y="129.8" font-size="12" fill="#b8382a" text-anchor="start">X = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">GS7</tspan>|</text><polyline points="32,179.0 48,179.0" fill="none" stroke="#c9561c" stroke-width="2"/><text x="54" y="183.0" font-size="12" fill="#c9561c" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">b1</tspan> min = X − |V<tspan baseline-shift="sub" font-size="75%">th5</tspan>|</text><polyline points="32,236 48,236" fill="none" stroke="#6a7079" stroke-width="2"/><text x="54" y="240" font-size="12" fill="#6a7079" text-anchor="start">0 V</text><line x1="52" y1="127.80000000000001" x2="52" y2="177.0" stroke="#c9561c" stroke-width="1.4" marker-end="url(#ahc9561c)"/></g><circle cx="324" cy="44" r="10" fill="#c9561c"/><text x="324" y="48.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="449.0" y="324" font-size="12.5" fill="#222" text-anchor="middle">X is set by M7; V<tspan baseline-shift="sub" font-size="75%">b1</tspan> sits one |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| below X</text><rect x="6" y="362" width="278" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(10,366)"><text x="135.0" y="36" font-size="13" fill="#222" text-anchor="middle" font-weight="600">M5 saturated (PMOS fence)</text><text x="135.0" y="66" font-size="12" fill="#6a7079" text-anchor="middle">drain X ≤ gate V<tspan baseline-shift="sub" font-size="75%">b1</tspan> + |V<tspan baseline-shift="sub" font-size="75%">th5</tspan>|</text><text x="55.34999999999998" y="96" font-size="13.5" fill="#c9561c" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">b1</tspan> ≥ V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">GS7</tspan>| − |V<tspan baseline-shift="sub" font-size="75%">th5</tspan>|</text><text x="135.0" y="126" font-size="13" fill="#222" text-anchor="middle" font-weight="600">M7 saturated</text><text x="135.0" y="156" font-size="12" fill="#6a7079" text-anchor="middle">its drain P keeps |V<tspan baseline-shift="sub" font-size="75%">ov7</tspan>| from V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text><text x="87.07500000000002" y="186" font-size="13.5" fill="#0e7d76" font-weight="600" xml:space="preserve">P ≤ V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">ov7</tspan>|</text><text x="67.63499999999999" y="216" font-size="13.5" fill="#0e7d76" xml:space="preserve">= V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">GS7</tspan>| + |V<tspan baseline-shift="sub" font-size="75%">th7</tspan>|</text></g><circle cx="20" cy="376" r="10" fill="#c9561c"/><text x="20" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="301.0" y="509.0" font-size="26" fill="#c9561c" text-anchor="middle">⇒</text><text x="145.0" y="656" font-size="12.5" fill="#222" text-anchor="middle">Two fences give V<tspan baseline-shift="sub" font-size="75%">b1</tspan> its range</text><rect x="310" y="362" width="278" height="278" rx="8" fill="#fbfaf7" stroke="#e2ddd1"/><g transform="translate(314,366)"><text x="135.0" y="40" font-size="13" fill="#222" text-anchor="middle" font-weight="600">Lec 3: diode-stack cascode mirror</text><text x="14.30999999999996" y="74" font-size="13.5" fill="#b8382a" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">out,max</tspan> = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">ov8</tspan>| − |V<tspan baseline-shift="sub" font-size="75%">ov6</tspan>| − |V<tspan baseline-shift="sub" font-size="75%">thp</tspan>|</text><text x="135.0" y="108" font-size="12" fill="#6a7079" text-anchor="middle">one |V<tspan baseline-shift="sub" font-size="75%">thp</tspan>| of swing lost (the diode tax)</text><text x="135.0" y="142" font-size="13" fill="#222" text-anchor="middle" font-weight="600">This load, V<tspan baseline-shift="sub" font-size="75%">b1</tspan> near its top</text><text x="39.824999999999974" y="176" font-size="13.5" fill="#2e7d4f" font-weight="600" xml:space="preserve">V<tspan baseline-shift="sub" font-size="75%">out,max</tspan> = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> − |V<tspan baseline-shift="sub" font-size="75%">ov8</tspan>| − |V<tspan baseline-shift="sub" font-size="75%">ov6</tspan>|</text><text x="135.0" y="210" font-size="12" fill="#6a7079" text-anchor="middle">the |V<tspan baseline-shift="sub" font-size="75%">thp</tspan>| tax is gone</text></g><circle cx="324" cy="376" r="10" fill="#c9561c"/><text x="324" y="380.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="449.0" y="656" font-size="12.5" fill="#222" text-anchor="middle">Why bother: full swing at the top</text><rect x="10" y="700" width="574" height="26" rx="6" fill="#e2f1e7" stroke="#b7dcc4"/><text x="297.0" y="718" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="middle">V<tspan baseline-shift="sub" font-size="75%">b1</tspan> between its two fences = cascode load without the diode tax</text></svg>