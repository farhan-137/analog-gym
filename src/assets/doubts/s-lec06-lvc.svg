-width="1.6"/><polyline points="82,62 70,62 70,80" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="88,50 108,50" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="81,38 73,34 73,42" fill="#0e7d76"/><text x="62" y="54" font-size="13" fill="#0e7d76" text-anchor="end" font-weight="600">M7</text><circle cx="70" cy="80" r="3" fill="#222"/><text x="78" y="86" font-size="12.5" fill="#b8382a" text-anchor="start" font-weight="600">P</text><polyline points="58,92 58,128" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="52,95 52,125" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="58,98 70,98 70,80" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="58,122 70,122 70,140" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="52,110 40,110" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="59,98 67,94 67,102" fill="#0e7d76"/><text x="37" y="114" font-size="12" fill="#0e7d76" text-anchor="end">V<tspan baseline-shift="sub" font-size="75%">b1</tspan></text><text x="78" y="114" font-size="13" fill="#0e7d76" text-anchor="start" font-weight="600">M5</text><circle cx="70" cy="140" r="3" fill="#222"/><text x="62" y="158" font-size="12.5" fill="#b8382a" text-anchor="end" font-weight="600">X</text><polyline points="70,140 70,176" fill="none" stroke="#222" stroke-width="1.6"/><text x="70" y="192" font-size="11" fill="#6a7079" text-anchor="middle">to M3, M1</text><polyline points="188,32 188,68" fill="none" stroke="#0e7d76" stroke-width="2.4"/><polyline points="182,35 182,65" fill="none" stroke="#0e7d76" stroke-width="2"/><polyline points="188,38 200,38 200,20" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="188,62 200,62 200,80" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polyline points="182,50 162,50" fill="none" stroke="#0e7d76" stroke-width="1.6"/><polygon points="189,38 197,34 197,42" fill="#0e7d76"/><text x="208" y="54" font-size="13" fill="#0e7d